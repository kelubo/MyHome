<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购物清单 · 冰箱库存 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#2563eb; --accent2:#1d4ed8; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
  --green:#047857; --amber:#b45309;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.tabs{display:flex;gap:8px;padding:16px 22px 0}
.tab{padding:9px 18px;border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:none;background:#eef2ff;color:var(--muted);cursor:pointer;font-weight:600;font-size:14px}
.tab.active{background:var(--card);color:var(--accent);border-color:var(--line)}
.toolbar{display:flex;gap:10px;padding:14px 22px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-top:none;margin:0 22px}
.toolbar .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
.toolbar label{font-size:12px;color:var(--muted)}
.toolbar input,.toolbar select{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.wrap{padding:16px 22px 30px;display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.item .chk{width:20px;height:20px;flex-shrink:0;cursor:pointer}
.item .main{flex:1;min-width:160px}
.item .nm{font-size:16px;font-weight:600}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .meta{font-size:13px;color:var(--muted);margin-top:3px}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef2ff;color:var(--accent);margin-left:6px}
.exp{font-size:12px;padding:3px 9px;border-radius:8px;font-weight:600}
.exp.soon{background:#fef3c7;color:var(--amber)}
.exp.over{background:#fee2e2;color:#b91c1c}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🛒</div>
  <h1>购物清单 · 冰箱库存</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="tabs">
  <div class="tab active" data-loc="shopping" id="tabShop">🛒 购物清单</div>
  <div class="tab" data-loc="fridge" id="tabFridge">🧊 冰箱库存</div>
</div>

<div class="toolbar" id="toolbar">
  <div class="field"><label>名称</label><input type="text" id="iName" placeholder="如 牛奶"></div>
  <div class="field"><label>分类</label><select id="iCat">
    <option>食材</option><option>日用品</option><option>饮料</option><option>其他</option>
  </select></div>
  <div class="field"><label>数量</label><input type="number" id="iQty" value="1" min="0" step="0.5"></div>
  <div class="field"><label>单位</label><input type="text" id="iUnit" placeholder="个/瓶/袋"></div>
  <div class="field" id="expField" style="display:none"><label>保质期</label><input type="date" id="iExp"></div>
  <div class="field"><label>&nbsp;</label><button class="btn" id="addBtn">＋ 添加</button></div>
</div>

<div class="wrap" id="list"></div>

<script>
const API = '/apps/pantry/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s); }

async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

let location='shopping', items=[];

function setTab(loc){
  location=loc;
  $('tabShop').classList.toggle('active', loc==='shopping');
  $('tabFridge').classList.toggle('active', loc==='fridge');
  $('expField').style.display = loc==='fridge' ? 'flex' : 'none';
  load();
}
$('tabShop').onclick=()=>setTab('shopping');
$('tabFridge').onclick=()=>setTab('fridge');

async function load(){
  try{
    items = await api('/items?location='+location);
    hideBanner();
  }catch(e){
    items=[]; showBanner('⚠️ 无法连接后端 API（需 docker 集成模式，含 pantry-api 与 pantry 数据库）。');
  }
  render();
}

function expHtml(d){
  if(!d) return '';
  const today=new Date(); today.setHours(0,0,0,0);
  const t=new Date(d); t.setHours(0,0,0,0);
  const diff=Math.round((t-today)/86400000);
  if(diff<0) return '<span class="exp over">已过期 '+Math.abs(diff)+'天</span>';
  if(diff<=3) return '<span class="exp soon">'+diff+'天后到期</span>';
  if(diff<=7) return '<span class="exp soon">'+diff+'天到期</span>';
  return '<span class="exp" style="background:#f1f5f9;color:#475569">'+d+'</span>';
}

function render(){
  const box=$('list'); box.innerHTML='';
  if(!items.length){ box.innerHTML='<div class="empty">'+(location==='shopping'?'购物清单是空的，添加要买的东西吧。':'冰箱库存是空的。')+'</div>'; return; }
  items.forEach(it=>{
    const el=document.createElement('div'); el.className='item'+(it.checked?' done':'');
    const exp = location==='fridge' ? expHtml(it.expiry) : '';
    const parts = [];
    parts.push((it.quantity||1) + ' ' + (it.unit||''));
    if(it.category && it.category!=='其他') parts.push('<span class="badge">'+esc(it.category)+'</span>');
    if(exp) parts.push(exp);
    if(it.note) parts.push('📝 '+esc(it.note));
    el.innerHTML =
      '<input type="checkbox" class="chk"'+(it.checked?' checked':'')+'>'+
      '<div class="main"><div class="nm"></div>'+
      '<div class="meta">'+parts.join(' · ')+'</div></div>'+
      '<button class="btn danger" data-del="'+it.id+'">🗑</button>';
    el.querySelector('.nm').textContent=it.name;
    el.querySelector('.chk').onchange=(e)=>toggle(it.id, e.target.checked);
    el.querySelector('[data-del]').onclick=()=>del(it.id);
    box.appendChild(el);
  });
}

function toggle(id, checked){
  api('/items/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({checked})})
    .then(load).catch(e=>showBanner('更新失败：'+e.message));
}
function del(id){
  if(!confirm('删除这个条目？')) return;
  api('/items/'+id,{method:'DELETE'}).then(load).catch(e=>showBanner('删除失败：'+e.message));
}

$('addBtn').onclick=async()=>{
  const name=$('iName').value.trim(); if(!name){ showBanner('名称必填'); return; }
  const payload={
    name, category:$('iCat').value, location,
    quantity:Number($('iQty').value||1), unit:$('iUnit').value.trim(),
    expiry: location==='fridge' ? ($('iExp').value||null) : null,
    checked: location==='shopping' ? false : true  // 入库即视为已存入
  };
  try{
    await api('/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('iName').value=''; $('iUnit').value=''; $('iExp').value='';
    await load();
  }catch(e){ showBanner('添加失败：'+e.message); }
};

load();
</script>
</body>
</html>
