<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭保险保单 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#6366f1; --accent2:#4f46e5; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar input,.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fafbff;outline:none}
.stats{display:flex;gap:10px;padding:0 22px 14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:90px;text-align:center}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.wrap{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(99,102,241,.12)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .title{font-size:17px;font-weight:700;flex:1;line-height:1.3}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#e0e7ff;color:#4338ca;font-weight:600}
.exp{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.exp.ok{background:#eef2f7;color:var(--muted)}
.exp.soon{background:#fef3c7;color:#d97706}
.exp.overdue{background:#fde2e2;color:#dc2626}
.exp.none{background:#eef2f7;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row .field{flex:1}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🛡️</div>
  <h1>家庭保险保单</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="搜险种 / 公司 / 保单号 / 被保人" style="min-width:200px">
  <select id="filterCategory"><option value="">全部分类</option></select>
  <select id="filterStatus">
    <option value="">全部状态</option>
    <option value="ok">正常</option>
    <option value="soon">临期</option>
    <option value="overdue">已过期</option>
    <option value="none">长期</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="addBtn">＋ 新增保单</button>
</div>

<div class="stats" id="stats"></div>

<div class="wrap" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">新增保单</h3>
    <div class="field"><label>保单名 / 险种 *</label><input type="text" id="mName" placeholder="如 小轿车商业险"></div>
    <div class="row">
      <div class="field"><label>分类</label>
        <select id="mCategory"><option>车险</option><option>医疗险</option><option>房屋险</option><option>意外险</option><option>寿险</option><option>其他</option></select>
      </div>
      <div class="field"><label>保险公司</label><input type="text" id="mCompany" placeholder="如 人保财险"></div>
    </div>
    <div class="row">
      <div class="field"><label>保单号</label><input type="text" id="mPolicyNo" placeholder="选填"></div>
      <div class="field"><label>被保人</label><input type="text" id="mInsured" placeholder="如 爸爸 / 全家"></div>
    </div>
    <div class="row">
      <div class="field"><label>年保费 ¥</label><input type="number" step="0.01" id="mPremium" value="0"></div>
      <div class="field"><label>保额 ¥</label><input type="number" step="0.01" id="mCoverage" placeholder="选填"></div>
    </div>
    <div class="row">
      <div class="field"><label>生效日</label><input type="date" id="mStart"></div>
      <div class="field"><label>到期日</label><input type="date" id="mEnd"></div>
    </div>
    <div class="row">
      <div class="field"><label>提前提醒(天)</label><input type="number" id="mRemind" value="30"></div>
      <div class="field"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="mNotes" placeholder="保障内容、续保提醒等"></textarea></div>
    <div class="acts">
      <button class="btn" id="mSave">💾 保存</button>
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete" style="display:none">🗑 删除</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/insurance/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

let policies = [];
let editingId = null;

async function load(){
  const q=$('search').value.trim(), c=$('filterCategory').value, s=$('filterStatus').value;
  const qs=[]; if(q) qs.push('q='+encodeURIComponent(q)); if(c) qs.push('category='+encodeURIComponent(c)); if(s) qs.push('status='+encodeURIComponent(s));
  try{
    policies = await api('/policies'+(qs.length?'?'+qs.join('&'):''));
    hideBanner();
  }catch(e){
    policies=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 insurance-api 后端与 insurance 数据库）。');
  }
  render();
}
async function loadStats(){
  try{
    const st=await api('/stats');
    const bc=st.by_category;
    $('stats').innerHTML =
      statBox(st.total,'保单总数')+
      statBox('¥'+(st.total_annual_premium!=null?st.total_annual_premium:0),'年保费合计')+
      statBox(st.expiring,'临期','#d97706')+
      statBox(st.expired,'已过期','#dc2626');
  }catch(e){}
}
async function loadCategories(){
  try{
    const cs=await api('/categories');
    const sel=$('filterCategory');
    cs.forEach(x=>{
      const o=document.createElement('option'); o.value=x.category; o.textContent=x.category+' ('+x.count+')'; sel.appendChild(o);
    });
  }catch(e){}
}
function statBox(n,l,color){
  return '<div class="stat"><div class="n" style="color:'+(color||'var(--accent)')+'">'+n+'</div><div class="l">'+l+'</div></div>';
}
function expLabel(p){
  if(p.exp_status==='overdue') return '已过期 '+(-p.exp_days_left)+' 天';
  if(p.exp_status==='soon') return '距到期 '+p.exp_days_left+' 天';
  if(p.exp_status==='ok') return '距到期 '+p.exp_days_left+' 天';
  return '长期有效';
}
function render(){
  const box=$('list'); box.innerHTML='';
  if(!policies.length){ box.innerHTML='<div class="empty">还没有保单记录。<br>点击右上角「＋ 新增保单」，登记车险/医疗险/房屋险等，到期前自动提醒续保。</div>'; return; }
  policies.forEach(p=>{
    const el=document.createElement('div'); el.className='card';
    const meta=[];
    if(p.company) meta.push('🏢 '+p.company);
    if(p.insured) meta.push('👤 '+p.insured);
    if(p.policy_no) meta.push('📄 '+p.policy_no);
    if(p.premium) meta.push('💰 ¥'+p.premium+'/年');
    el.innerHTML =
      '<div class="top"><div class="title"></div><span class="badge"></span></div>'+
      '<div style="margin:6px 0"><span class="exp '+p.exp_status+'"></span></div>'+
      (meta.length?'<div class="meta"></div>':'')+
      '<div class="meta"></div>'+
      (p.notes?'<div class="meta" style="margin-top:4px"></div>':'');
    el.querySelector('.title').textContent=p.name;
    el.querySelector('.badge').textContent=p.category;
    el.querySelector('.exp').textContent=expLabel(p);
    el.querySelector('.meta').textContent='';
    const metas=el.querySelectorAll('.meta');
    if(meta.length) metas[0].textContent=meta.join(' · ');
    metas[1].textContent=(p.start_date?('生效 '+p.start_date):'')+(p.end_date?(' · 到期 '+p.end_date):'');
    if(p.notes) metas[metas.length-1].textContent='📝 '+p.notes;
    el.onclick=()=>openModal(p);
    box.appendChild(el);
  });
}
function openModal(p){
  editingId = p ? p.id : null;
  $('modalTitle').textContent = p ? '编辑保单' : '新增保单';
  $('mName').value = p?(p.name||''):'';
  $('mCategory').value = p?(p.category||'其他'):'其他';
  $('mCompany').value = p?(p.company||''):'';
  $('mPolicyNo').value = p?(p.policy_no||''):'';
  $('mInsured').value = p?(p.insured||''):'';
  $('mPremium').value = p?(p.premium||0):0;
  $('mCoverage').value = p?(p.coverage!=null?p.coverage:''):'';
  $('mStart').value = p?(p.start_date||''):'';
  $('mEnd').value = p?(p.end_date||''):'';
  $('mRemind').value = p?(p.remind_days||30):30;
  $('mNotes').value = p?(p.notes||''):'';
  $('mDelete').style.display = p?'inline-block':'none';
  $('modal').classList.add('show');
}
$('addBtn').onclick=()=>openModal(null);
$('mCancel').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',(e)=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
$('mSave').onclick=async()=>{
  const payload={
    name:$('mName').value.trim(), category:$('mCategory').value,
    company:$('mCompany').value.trim(), policy_no:$('mPolicyNo').value.trim(),
    insured:$('mInsured').value.trim(),
    premium:parseFloat($('mPremium').value||'0')||0,
    coverage:$('mCoverage').value===''?'':parseFloat($('mCoverage').value),
    start_date:$('mStart').value, end_date:$('mEnd').value,
    remind_days:parseInt($('mRemind').value||'30',10)||30,
    notes:$('mNotes').value.trim()
  };
  if(!payload.name){ showBanner('保单名必填'); return; }
  try{
    if(editingId) await api('/policies/'+editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/policies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('modal').classList.remove('show'); await load(); await loadStats(); await loadCategories();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
$('mDelete').onclick=async()=>{
  if(!editingId) return;
  if(!confirm('删除该保单？')) return;
  try{ await api('/policies/'+editingId,{method:'DELETE'}); $('modal').classList.remove('show'); await load(); await loadStats(); await loadCategories(); }
  catch(e){ showBanner('删除失败：'+e.message); }
};
$('search').oninput=load;
$('filterCategory').onchange=load;
$('filterStatus').onchange=load;
loadCategories(); loadStats(); load();
</script>
</body>
</html>
