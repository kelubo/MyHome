<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭密码箱 · MyHome</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
  --accent:#22c55e; --accent2:#16a34a; --line:#334155; --radius:14px; --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#06240f;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2);color:#fff}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#3a2a12;color:#fbbf24;border-bottom:1px solid #5c4520;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar input,.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#0b1220;color:var(--text);outline:none}
.wrap{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card .title{font-size:17px;font-weight:700;flex:1}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#14331f;color:var(--accent);font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.row .k{color:var(--muted);min-width:54px}
.row .v{flex:1;word-break:break-all}
.row .act{color:var(--accent);cursor:pointer;border:none;background:transparent;font-size:12px;white-space:nowrap}
.mask{letter-spacing:2px;font-family:monospace}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.65);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--card);border-radius:14px;padding:22px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#0b1220;color:var(--text);font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🔐</div>
  <h1>家庭密码箱</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="搜标题 / 分类" style="min-width:200px">
  <select id="filterCategory"><option value="">全部分类</option></select>
  <div class="spacer"></div>
  <button class="btn" id="addBtn">＋ 新增条目</button>
</div>

<div class="wrap" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">新增条目</h3>
    <div class="field"><label>标题 *</label><input type="text" id="mTitle" placeholder="如：家庭宽带"></div>
    <div class="field"><label>分类</label><input type="text" id="mCategory" placeholder="如：银行 / 邮箱 / 会员" list="catList"></div>
    <div class="field"><label>用户名 / 账号</label><input type="text" id="mUsername"></div>
    <div class="field"><label>密码</label><input type="text" id="mPassword" placeholder="密码（加密存储）"></div>
    <div class="field"><label>网址</label><input type="text" id="mUrl" placeholder="https://..."></div>
    <div class="field"><label>备注</label><textarea id="mNotes" placeholder="安全问题、提示等"></textarea></div>
    <datalist id="catList"></datalist>
    <div class="acts">
      <button class="btn" id="mSave">💾 保存</button>
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete" style="display:none">🗑 删除</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/vault/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function mask(pw){ return pw? '•'.repeat(Math.min(pw.length,12)) : ''; }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); showBanner('已复制到剪贴板'); }catch(e){ showBanner('复制失败，请手动选择'); } }
let hideAll = {};   // sid -> bool 是否显明

let secrets = [];
let editingId = null;

async function load(){
  const q=$('search').value.trim(), c=$('filterCategory').value;
  const qs=[]; if(q) qs.push('q='+encodeURIComponent(q)); if(c) qs.push('category='+encodeURIComponent(c));
  try{
    secrets = await api('/secrets'+(qs.length?'?'+qs.join('&'):''));
    hideBanner();
  }catch(e){
    secrets=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 vault-api 后端与 vault 数据库）。');
  }
  render();
}
async function loadCategories(){
  try{
    const cs=await api('/categories');
    const sel=$('filterCategory'); cs.forEach(x=>{ const o=document.createElement('option'); o.value=x.category; o.textContent=x.category+' ('+x.count+')'; sel.appendChild(o);
      const o2=document.createElement('option'); o2.value=x.category; o2.textContent=x.category; $('catList').appendChild(o2); });
  }catch(e){}
}
async function checkHealth(){
  try{
    const h=await api('/health');
    if(h.warning) showBanner('⚠️ 安全提示：当前未启用 cryptography，密码仅以 base64 混淆存储（不安全）。请在生产环境安装 cryptography 并配置 VAULT_KEY / ./data/vault 密钥文件。');
    else showBanner('🔐 密码以 Fernet 加密存储于服务器（密钥在 ./data/vault/vault.key）。仅在家庭受信任网络内使用，请勿在公网暴露本服务；备份时一并保管好 vault.key。');
    setTimeout(()=>{ if(banner.textContent.startsWith('🔐')) hideBanner(); }, 9000);
  }catch(e){}
}
function render(){
  const box=$('list'); box.innerHTML='';
  if(!secrets.length){ box.innerHTML='<div class="empty">密码箱还是空的。<br>点击右上角「＋ 新增条目」，登记账号与密码（将加密存储）。</div>'; return; }
  secrets.forEach(s=>{
    const el=document.createElement('div'); el.className='card';
    const show = hideAll[s.id];
    const pwHtml = show
      ? '<span class="v">'+esc(s.password)+'</span><button class="act" data-act="hide">🙈</button>'
      : '<span class="v mask">'+mask(s.password)+'</span><button class="act" data-act="show">👁</button>';
    el.innerHTML =
      '<div class="top"><div class="title"></div><span class="badge"></span></div>'+
      (s.username?'<div class="row"><span class="k">账号</span><span class="v"></span><button class="act" data-act="copyU">复制</button></div>':'')+
      (s.password?'<div class="row"><span class="k">密码</span>'+pwHtml+'<button class="act" data-act="copyP">复制</button></div>':'')+
      (s.url?'<div class="row"><span class="k">网址</span><a class="v" target="_blank" rel="noopener" style="color:var(--accent)"></a><button class="act" data-act="copyUrl">复制</button></div>':'')+
      (s.notes?'<div class="row"><span class="k">备注</span><span class="v"></span></div>':'');
    el.querySelector('.title').textContent=s.title;
    el.querySelector('.badge').textContent=s.category;
    if(s.username) el.querySelectorAll('.row')[0].querySelector('.v').textContent=s.username;
    if(s.notes){ const rows=el.querySelectorAll('.row'); rows[rows.length-1].querySelector('.v').textContent=s.notes; }
    if(s.url){ const a=el.querySelector('a.v'); a.textContent=s.url; a.href=s.url; }
    el.querySelectorAll('.act').forEach(b=>{
      b.onclick=(ev)=>{ ev.stopPropagation();
        const act=b.getAttribute('data-act');
        if(act==='show'){ hideAll[s.id]=true; render(); }
        else if(act==='hide'){ hideAll[s.id]=false; render(); }
        else if(act==='copyU') copyText(s.username);
        else if(act==='copyP') copyText(s.password);
        else if(act==='copyUrl') copyText(s.url);
      };
    });
    el.onclick=()=>openModal(s);
    box.appendChild(el);
  });
}
function openModal(s){
  editingId = s ? s.id : null;
  $('modalTitle').textContent = s ? '编辑条目' : '新增条目';
  $('mTitle').value = s?(s.title||''):'';
  $('mCategory').value = s?(s.category||'其他'):'';
  $('mUsername').value = s?(s.username||''):'';
  $('mPassword').value = s?(s.password||''):'';
  $('mUrl').value = s?(s.url||''):'';
  $('mNotes').value = s?(s.notes||''):'';
  $('mDelete').style.display = s?'inline-block':'none';
  $('modal').classList.add('show');
}
$('addBtn').onclick=()=>openModal(null);
$('mCancel').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',(e)=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
$('mSave').onclick=async()=>{
  const payload={ title:$('mTitle').value.trim(), category:$('mCategory').value.trim()||'其他',
    username:$('mUsername').value.trim(), password:$('mPassword').value, url:$('mUrl').value.trim(), notes:$('mNotes').value.trim() };
  if(!payload.title){ showBanner('标题必填'); return; }
  try{
    if(editingId) await api('/secrets/'+editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/secrets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('modal').classList.remove('show'); await load(); await loadCategories();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
$('mDelete').onclick=async()=>{
  if(!editingId) return;
  if(!confirm('删除该条目？')) return;
  try{ await api('/secrets/'+editingId,{method:'DELETE'}); $('modal').classList.remove('show'); await load(); }
  catch(e){ showBanner('删除失败：'+e.message); }
};
$('search').oninput=load;
$('filterCategory').onchange=load;
checkHealth(); loadCategories(); load();
</script>
</body>
</html>
