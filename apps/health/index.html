<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健康档案 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#2563eb; --accent2:#1d4ed8; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fafbff;outline:none}
.wrap{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(37,99,235,.12)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card .title{font-size:17px;font-weight:700;flex:1}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#eef2ff;color:var(--accent);font-weight:600}
.card .date{color:var(--muted);font-size:13px;margin-bottom:6px}
.card .line{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.card .val{font-weight:700;color:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row .field{flex:1;margin-bottom:12px}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🩺</div>
  <h1>健康档案</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <select id="filterMember"><option value="">全部成员</option></select>
  <select id="filterType"><option value="">全部类型</option></select>
  <div class="spacer"></div>
  <button class="btn" id="addBtn">＋ 新增记录</button>
</div>

<div class="wrap" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">新增记录</h3>
    <div class="row">
      <div class="field"><label>成员</label><input type="text" id="mMember" placeholder="如：我 / 孩子"></div>
      <div class="field"><label>类型</label>
        <select id="mType">
          <option>就诊</option><option>用药</option><option>体征</option>
          <option>疫苗</option><option>其他</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>日期</label><input type="date" id="mDate"></div>
      <div class="field"><label>项目</label><input type="text" id="mItem" placeholder="诊断 / 药名 / 指标"></div>
    </div>
    <div class="row">
      <div class="field"><label>数值</label><input type="text" id="mValue" placeholder="如 68.5"></div>
      <div class="field"><label>单位</label><input type="text" id="mUnit" placeholder="如 kg"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="mNotes" placeholder="补充说明"></textarea></div>
    <div class="acts">
      <button class="btn" id="mSave">💾 保存</button>
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete" style="display:none">🗑 删除</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/health/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

let records = [];
let editingId = null;

async function load(){
  const m = $('filterMember').value, t = $('filterType').value;
  const qs = []; if(m) qs.push('member='+encodeURIComponent(m)); if(t) qs.push('type='+encodeURIComponent(t));
  try{
    records = await api('/records'+(qs.length?'?'+qs.join('&'):''));
    hideBanner();
  }catch(e){
    records=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 health-api 后端与 health 数据库）。');
  }
  render();
}
async function loadFilters(){
  try{
    const ms = await api('/members');
    ms.forEach(x=>{ const o=document.createElement('option'); o.value=x.member; o.textContent=x.member; $('filterMember').appendChild(o); });
  }catch(e){}
  ['就诊','用药','体征','疫苗','其他'].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=c; $('filterType').appendChild(o);
  });
}
function render(){
  const box=$('list'); box.innerHTML='';
  if(!records.length){ box.innerHTML='<div class="empty">还没有健康记录。<br>点击右上角「＋ 新增记录」，登记就诊、用药、体征（体重/血压等）、疫苗等信息。</div>'; return; }
  records.forEach(r=>{
    const el=document.createElement('div'); el.className='card';
    const val = (r.value||r.unit) ? ('<span class="val">'+(r.value||'')+' '+(r.unit||'')+'</span>') : '';
    el.innerHTML =
      '<div class="top"><div class="title"></div><span class="badge"></span></div>'+
      '<div class="date">📅 '+(r.date||'')+' · 👤 '+r.member+'</div>'+
      '<div class="line">'+ (r.item||'') + (val?(' · '+val):'') +'</div>'+
      (r.notes?'<div class="line" style="color:var(--muted);margin-top:4px"></div>':'');
    el.querySelector('.title').textContent=r.type;
    el.querySelector('.badge').textContent=r.item||'—';
    if(r.notes) el.querySelectorAll('.line')[1].textContent=r.notes;
    el.onclick=()=>openModal(r);
    box.appendChild(el);
  });
}
function openModal(r){
  editingId = r ? r.id : null;
  $('modalTitle').textContent = r ? '编辑记录' : '新增记录';
  $('mMember').value = r?(r.member||'我'):'';
  $('mType').value = r?(r.type||'就诊'):'就诊';
  $('mDate').value = r?r.date:todayStr();
  $('mItem').value = r?(r.item||''):'';
  $('mValue').value = r?(r.value||''):'';
  $('mUnit').value = r?(r.unit||''):'';
  $('mNotes').value = r?(r.notes||''):'';
  $('mDelete').style.display = r?'inline-block':'none';
  $('modal').classList.add('show');
}
$('addBtn').onclick=()=>openModal(null);
$('mCancel').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',(e)=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
$('mSave').onclick=async()=>{
  const payload={
    member:$('mMember').value.trim()||'我', type:$('mType').value, date:$('mDate').value,
    item:$('mItem').value.trim(), value:$('mValue').value.trim(), unit:$('mUnit').value.trim(), notes:$('mNotes').value.trim()
  };
  if(!payload.date){ showBanner('日期必填'); return; }
  try{
    if(editingId) await api('/records/'+editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('modal').classList.remove('show'); await load(); await loadFilters();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
$('mDelete').onclick=async()=>{
  if(!editingId) return;
  if(!confirm('删除该记录？')) return;
  try{ await api('/records/'+editingId,{method:'DELETE'}); $('modal').classList.remove('show'); await load(); }
  catch(e){ showBanner('删除失败：'+e.message); }
};
$('filterMember').onchange=load;
$('filterType').onchange=load;
loadFilters(); load();
</script>
</body>
</html>
