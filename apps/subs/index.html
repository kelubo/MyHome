<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订阅 · 会员续费 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#2563eb; --accent2:#1d4ed8; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fafbff;outline:none}
.summary{display:flex;gap:14px;padding:0 22px 14px;flex-wrap:wrap}
.sum-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:150px}
.sum-card .k{font-size:12px;color:var(--muted)}
.sum-card .v{font-size:22px;font-weight:800;color:var(--accent);margin-top:2px}
.wrap{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(37,99,235,.12)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card .title{font-size:17px;font-weight:700;flex:1}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#eef2ff;color:var(--accent);font-weight:600}
.card .amt{font-size:15px;font-weight:700;margin-bottom:6px}
.card .amt small{font-weight:500;color:var(--muted)}
.card .due{font-size:13px;color:var(--muted);margin-bottom:6px}
.card .notes{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.cd{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px}
.cd.today{background:#fee2e2;color:#b91c1c}
.cd.soon{background:#ecfdf5;color:#047857}
.cd.far{background:#f1f5f9;color:#475569}
.cd.past{background:#fafafa;color:#9ca3af}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row .field{flex:1;margin-bottom:12px}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">💳</div>
  <h1>订阅 · 会员续费</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="summary" id="summary"></div>

<div class="toolbar">
  <select id="filterCat"><option value="">全部分类</option></select>
  <div class="spacer"></div>
  <button class="btn" id="addBtn">＋ 新增订阅</button>
</div>

<div class="wrap" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">新增订阅</h3>
    <div class="field"><label>名称</label><input type="text" id="mName" placeholder="如：家庭宽带 / 视频会员"></div>
    <div class="row">
      <div class="field"><label>分类</label>
        <select id="mCat">
          <option>视频</option><option>音乐</option><option>宽带</option>
          <option>保险</option><option>教育</option><option>其他</option>
        </select>
      </div>
      <div class="field"><label>周期</label>
        <select id="mCycle">
          <option>月</option><option>季</option><option>年</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>金额 (¥)</label><input type="number" id="mAmount" step="0.01" min="0"></div>
      <div class="field"><label>下次续费日</label><input type="date" id="mNext"></div>
    </div>
    <div class="field"><label>提前提醒天数</label><input type="number" id="mRemind" value="7" min="0"></div>
    <div class="field"><label>备注</label><textarea id="mNotes" placeholder="如：连续包月，记得取消"></textarea></div>
    <div class="acts">
      <button class="btn" id="mSave">💾 保存</button>
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete" style="display:none">🗑 删除</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/subs/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysLeft(s){ if(!s.next_date) return null; const t=new Date(); t.setHours(0,0,0,0); const d=new Date(s.next_date+'T00:00:00'); return Math.round((d-t)/86400000); }
function cdHtml(days, remind){
  if(days===null) return '';
  if(days<0) return '<span class="cd past">已过期 '+ (-days) +' 天</span>';
  if(days===0) return '<span class="cd today">今天到期</span>';
  if(days<=remind) return '<span class="cd soon">还有 '+days+' 天到期 ⏰</span>';
  return '<span class="cd far">还有 '+days+' 天</span>';
}

let subs = [];
let editingId = null;

async function load(){
  const cat = $('filterCat').value;
  try{
    subs = await api('/subs'+(cat?'?category='+encodeURIComponent(cat):''));
    hideBanner();
  }catch(e){
    subs=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 subs-api 后端与 subs 数据库）。');
  }
  render();
}
async function loadSummary(){
  try{
    const s = await api('/summary');
    $('summary').innerHTML =
      '<div class="sum-card"><div class="k">每月摊销</div><div class="v">¥'+s.monthly.toFixed(2)+'</div></div>'+
      '<div class="sum-card"><div class="k">每年花费</div><div class="v">¥'+s.yearly.toFixed(2)+'</div></div>'+
      '<div class="sum-card"><div class="k">订阅数量</div><div class="v">'+s.count+'</div></div>';
  }catch(e){}
}
function render(){
  const box=$('list'); box.innerHTML='';
  if(!subs.length){ box.innerHTML='<div class="empty">还没有订阅记录。<br>点击右上角「＋ 新增订阅」，把视频会员、宽带、保险等连续扣费登记在这里，到期自动提醒。</div>'; return; }
  subs.forEach(s=>{
    const dl=daysLeft(s);
    const el=document.createElement('div'); el.className='card';
    el.innerHTML =
      '<div class="top"><div class="title"></div><span class="badge"></span></div>'+
      '<div class="amt">¥'+ (s.amount||0).toFixed(2) +' <small>/ '+s.cycle+'</small></div>'+
      '<div class="due">📅 下次续费：'+(s.next_date||'未设置')+'</div>'+
      (s.notes?'<div class="notes"></div>':'')+
      cdHtml(dl, s.remind_days||7);
    el.querySelector('.title').textContent=s.name;
    el.querySelector('.badge').textContent=s.category;
    if(s.notes) el.querySelector('.notes').textContent=s.notes;
    el.onclick=()=>openModal(s);
    box.appendChild(el);
  });
}
function openModal(s){
  editingId = s ? s.id : null;
  $('modalTitle').textContent = s ? '编辑订阅' : '新增订阅';
  $('mName').value = s?s.name:'';
  $('mCat').value = s?(s.category||'其他'):'视频';
  $('mCycle').value = s?(s.cycle||'月'):'月';
  $('mAmount').value = s?(s.amount||0):'';
  $('mNext').value = s?s.next_date:'';
  $('mRemind').value = s?(s.remind_days||7):7;
  $('mNotes').value = s?(s.notes||''):'';
  $('mDelete').style.display = s?'inline-block':'none';
  $('modal').classList.add('show');
}
$('addBtn').onclick=()=>openModal(null);
$('mCancel').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',(e)=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
$('mSave').onclick=async()=>{
  const payload={
    name:$('mName').value.trim(), category:$('mCat').value, cycle:$('mCycle').value,
    amount:parseFloat($('mAmount').value||0), next_date:$('mNext').value,
    remind_days:parseInt($('mRemind').value||0), notes:$('mNotes').value.trim()
  };
  if(!payload.name){ showBanner('名称必填'); return; }
  try{
    if(editingId) await api('/subs/'+editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/subs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('modal').classList.remove('show'); await load(); await loadSummary();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
$('mDelete').onclick=async()=>{
  if(!editingId) return;
  if(!confirm('删除该订阅？')) return;
  try{ await api('/subs/'+editingId,{method:'DELETE'}); $('modal').classList.remove('show'); await load(); await loadSummary(); }
  catch(e){ showBanner('删除失败：'+e.message); }
};
$('filterCat').onchange=load;
['视频','音乐','宽带','保险','教育','其他'].forEach(c=>{
  const o=document.createElement('option'); o.value=c; o.textContent=c; $('filterCat').appendChild(o);
});
load(); loadSummary();
</script>
</body>
</html>
