<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠物照护 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#f59e0b; --accent2:#d97706; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:#fafbff;outline:none;min-width:160px}
.toolbar .spacer{flex:1}
.wrap{padding:0 22px 30px;display:grid;grid-template-columns:1fr;gap:16px;max-width:860px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pet-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pet-avatar{font-size:46px}
.pet-name{font-size:22px;font-weight:800}
.pet-sub{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.kv .item{background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv .k{font-size:11px;color:var(--muted)}
.kv .v{font-size:14px;font-weight:600}
.care-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.care-form input,.care-form select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fafbff;outline:none}
.care-list{display:flex;flex-direction:column;gap:8px}
.care-item{display:flex;align-items:flex-start;gap:10px;background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.care-item .date{font-size:13px;color:var(--muted);min-width:96px}
.care-item .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#fef3c7;color:var(--accent2);font-weight:600;white-space:nowrap}
.care-item .note{flex:1;font-size:13px;line-height:1.5}
.care-item .del{color:var(--danger);cursor:pointer;border:none;background:transparent;font-size:13px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row .field{flex:1}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🐾</div>
  <h1>宠物照护</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <select id="petSelect"><option value="">— 选择宠物 —</option></select>
  <button class="btn ghost" id="editPetBtn">✎ 编辑</button>
  <button class="btn danger" id="delPetBtn">🗑 删除</button>
  <div class="spacer"></div>
  <button class="btn" id="addPetBtn">＋ 新增宠物</button>
</div>

<div class="wrap" id="wrap"></div>

<div class="modal" id="petModal">
  <div class="modal-box">
    <h3 id="petModalTitle">新增宠物</h3>
    <div class="row">
      <div class="field"><label>名字 *</label><input type="text" id="pName" placeholder="如：豆豆"></div>
      <div class="field"><label>种类</label>
        <select id="pSpecies"><option>狗</option><option>猫</option><option>其他</option></select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>品种</label><input type="text" id="pBreed" placeholder="如：柯基"></div>
      <div class="field"><label>性别</label>
        <select id="pGender"><option>公</option><option>母</option><option>未知</option></select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>生日</label><input type="date" id="pBirthday"></div>
      <div class="field"><label>体重</label><input type="text" id="pWeight" placeholder="如 12 kg"></div>
    </div>
    <div class="row">
      <div class="field"><label>芯片号</label><input type="text" id="pMicrochip"></div>
      <div class="field"><label>常去医院</label><input type="text" id="pVet"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="pNotes" placeholder="性格、忌口等"></textarea></div>
    <div class="acts">
      <button class="btn" id="pSave">💾 保存</button>
      <button class="btn ghost" id="pCancel">取消</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/pets/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const SPECIES_ICON = {狗:'🐶',猫:'🐱',其他:'🐾'};

let pets = [];
let selectedId = null;
let care = [];

async function loadPets(){
  try{
    pets = await api('/pets'); hideBanner();
    const sel=$('petSelect'); sel.innerHTML='<option value="">— 选择宠物 —</option>';
    pets.forEach(p=>{ const o=document.createElement('option'); o.value=p.id; o.textContent=p.name+'（'+(p.species||'')+'）'; sel.appendChild(o); });
    if(pets.length && selectedId===null) selectedId=pets[0].id;
    if(!pets.find(p=>p.id===selectedId)) selectedId = pets.length?pets[0].id:null;
    sel.value = selectedId||'';
  }catch(e){
    pets=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 pets-api 后端与 pets 数据库）。');
  }
  render();
}
async function loadCare(){
  if(!selectedId){ care=[]; render(); return; }
  try{ care = await api('/pets/'+selectedId+'/care'); }catch(e){ care=[]; }
  render();
}
function render(){
  const wrap=$('wrap'); wrap.innerHTML='';
  if(!pets.length){
    wrap.innerHTML='<div class="empty">还没有登记宠物。<br>点击右上角「＋ 新增宠物」，记录毛孩子的资料与日常照护。</div>';
    return;
  }
  const pet = pets.find(p=>p.id===selectedId);
  if(!pet) return;
  const icon = SPECIES_ICON[pet.species]||'🐾';
  const kv=[];
  if(pet.breed) kv.push(['品种',pet.breed]);
  if(pet.birthday) kv.push(['生日',pet.birthday]);
  if(pet.gender) kv.push(['性别',pet.gender]);
  if(pet.weight) kv.push(['体重',pet.weight]);
  if(pet.microchip) kv.push(['芯片号',pet.microchip]);
  if(pet.vet) kv.push(['常去医院',pet.vet]);
  let html = '<div class="panel"><div class="pet-head"><div class="pet-avatar">'+icon+'</div>'+
    '<div><div class="pet-name">'+esc(pet.name)+'</div><div class="pet-sub">'+(pet.species||'')+'</div></div></div>';
  html += '<div class="kv">';
  kv.forEach(([k,v])=>{ html+='<div class="item"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>'; });
  html += '</div>';
  if(pet.notes) html+='<div class="kv" style="margin-top:10px"><div class="item" style="grid-column:1/-1"><div class="k">备注</div><div class="v" style="font-weight:400">'+esc(pet.notes)+'</div></div></div>';
  html += '</div>';

  html += '<div class="panel" style="margin-top:16px"><h3>🩺 照护记录</h3>';
  html += '<div class="care-form"><input type="date" id="cDate" value="'+todayStr()+'">'+
    '<select id="cType"><option>喂食</option><option>驱虫</option><option>疫苗</option><option>体检</option><option>洗澡</option><option>其他</option></select>'+
    '<input type="text" id="cNote" placeholder="备注，如：体内外驱虫" style="flex:1;min-width:180px">'+
    '<button class="btn" id="cAdd">＋ 添加</button></div>';
  html += '<div class="care-list" id="careList"></div></div>';
  wrap.innerHTML = html;

  const cl=$('careList');
  if(!care.length){ cl.innerHTML='<div class="empty" style="padding:24px">还没有照护记录。</div>'; }
  else{
    care.forEach(c=>{
      const el=document.createElement('div'); el.className='care-item';
      el.innerHTML='<div class="date">'+c.date+'</div><span class="badge">'+esc(c.ctype)+'</span><div class="note"></div><button class="del">删除</button>';
      el.querySelector('.note').textContent=c.note||'';
      el.querySelector('.del').onclick=async()=>{ if(!confirm('删除该照护记录？')) return; try{ await api('/care/'+c.id,{method:'DELETE'}); await loadCare(); }catch(e){ showBanner('删除失败：'+e.message); } };
      cl.appendChild(el);
    });
  }
  $('cAdd').onclick=async()=>{
    const payload={ date:$('cDate').value, ctype:$('cType').value, note:$('cNote').value.trim() };
    if(!payload.date){ showBanner('请选择日期'); return; }
    try{ await api('/pets/'+selectedId+'/care',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      $('cNote').value=''; await loadCare(); }catch(e){ showBanner('添加失败：'+e.message); }
  };
}
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

// 宠物选择 / 编辑 / 删除
$('petSelect').onchange=()=>{ selectedId = $('petSelect').value?parseInt($('petSelect').value,10):null; loadCare(); };
$('addPetBtn').onclick=()=>openPetModal(null);
$('editPetBtn').onclick=()=>{ const p=pets.find(x=>x.id===selectedId); if(p) openPetModal(p); else showBanner('请先选择宠物'); };
$('delPetBtn').onclick=async()=>{ const p=pets.find(x=>x.id===selectedId); if(!p) return; if(!confirm('删除宠物「'+p.name+'」及其全部照护记录？')) return;
  try{ await api('/pets/'+selectedId,{method:'DELETE'}); selectedId=null; await loadPets(); await loadCare(); }catch(e){ showBanner('删除失败：'+e.message); } };

function openPetModal(p){
  $('petModalTitle').textContent = p?'编辑宠物':'新增宠物';
  $('pName').value = p?(p.name||''):'';
  $('pSpecies').value = p?(p.species||'其他'):'狗';
  $('pBreed').value = p?(p.breed||''):'';
  $('pGender').value = p?(p.gender||'未知'):'公';
  $('pBirthday').value = p?(p.birthday||''):'';
  $('pWeight').value = p?(p.weight||''):'';
  $('pMicrochip').value = p?(p.microchip||''):'';
  $('pVet').value = p?(p.vet||''):'';
  $('pNotes').value = p?(p.notes||''):'';
  $('petModal').classList.add('show');
}
$('pCancel').onclick=()=>$('petModal').classList.remove('show');
$('petModal').addEventListener('click',(e)=>{ if(e.target===$('petModal')) $('petModal').classList.remove('show'); });
$('pSave').onclick=async()=>{
  const payload={ name:$('pName').value.trim(), species:$('pSpecies').value, breed:$('pBreed').value.trim(),
    gender:$('pGender').value, birthday:$('pBirthday').value, weight:$('pWeight').value.trim(),
    microchip:$('pMicrochip').value.trim(), vet:$('pVet').value.trim(), notes:$('pNotes').value.trim() };
  if(!payload.name){ showBanner('名字必填'); return; }
  const p=pets.find(x=>x.id===selectedId);
  try{
    if(p) await api('/pets/'+p.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/pets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('petModal').classList.remove('show'); await loadPets(); await loadCare();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
loadPets(); loadCare();
</script>
</body>
</html>
