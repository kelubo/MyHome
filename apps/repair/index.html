<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房屋维修记录 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#f59e0b; --accent2:#d97706; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar input,.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fafbff;outline:none}
.stats{display:flex;gap:10px;padding:0 22px 14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:90px;text-align:center}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.wrap{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(245,158,11,.12)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .title{font-size:17px;font-weight:700;flex:1;line-height:1.3}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#fef3c7;color:#b45309;font-weight:600}
.sbadge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.sbadge.已完成{background:#dcfce7;color:#16a34a}
.sbadge.进行中{background:#dbeafe;color:#2563eb}
.sbadge.待处理{background:#fee2e2;color:#dc2626}
.exp{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.exp.ok{background:#eef2f7;color:var(--muted)}
.exp.soon{background:#fef3c7;color:#d97706}
.exp.overdue{background:#fde2e2;color:#dc2626}
.exp.none{background:#eef2f7;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row .field{flex:1}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🔧</div>
  <h1>房屋维修记录</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="搜标题 / 位置" style="min-width:180px">
  <select id="filterCategory"><option value="">全部分类</option></select>
  <select id="filterStatus">
    <option value="">全部状态</option>
    <option>待处理</option><option>进行中</option><option>已完成</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="addBtn">＋ 新增记录</button>
</div>

<div class="stats" id="stats"></div>

<div class="wrap" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">新增记录</h3>
    <div class="field"><label>标题 *</label><input type="text" id="mTitle" placeholder="如 更换客厅吸顶灯"></div>
    <div class="row">
      <div class="field"><label>位置</label><input type="text" id="mLocation" placeholder="如 主卧/厨房水管"></div>
      <div class="field"><label>分类</label>
        <select id="mCategory"><option>水电</option><option>电器</option><option>墙面</option><option>管道</option><option>家具</option><option>其他</option></select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>维修日期</label><input type="date" id="mDate"></div>
      <div class="field"><label>费用 ¥</label><input type="number" step="0.01" id="mCost" value="0"></div>
    </div>
    <div class="row">
      <div class="field"><label>状态</label>
        <select id="mStatus"><option>已完成</option><option>进行中</option><option>待处理</option></select>
      </div>
      <div class="field"><label>下次检查日</label><input type="date" id="mNext"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="mNotes" placeholder="维修内容、用料、师傅联系方式等"></textarea></div>
    <div class="acts">
      <button class="btn" id="mSave">💾 保存</button>
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete" style="display:none">🗑 删除</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/repair/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

let repairs = [];
let editingId = null;

async function load(){
  const q=$('search').value.trim(), c=$('filterCategory').value, s=$('filterStatus').value;
  const qs=[]; if(q) qs.push('q='+encodeURIComponent(q)); if(c) qs.push('category='+encodeURIComponent(c)); if(s) qs.push('status='+encodeURIComponent(s));
  try{
    repairs = await api('/repairs'+(qs.length?'?'+qs.join('&'):''));
    hideBanner();
  }catch(e){
    repairs=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 repair-api 后端与 repair 数据库）。');
  }
  render();
}
async function loadStats(){
  try{
    const st=await api('/stats');
    const bs=st.by_status;
    $('stats').innerHTML =
      statBox(st.total,'记录总数')+
      statBox(bs['待处理']||0,'待处理','#dc2626')+
      statBox(bs['进行中']||0,'进行中','#2563eb')+
      statBox('¥'+(st.total_cost!=null?st.total_cost:0),'累计花费')+
      statBox(st.upcoming_checks,'待查/临期','#d97706');
  }catch(e){}
}
async function loadCategories(){
  try{
    const cs=await api('/categories');
    const sel=$('filterCategory');
    cs.forEach(x=>{
      const o=document.createElement('option'); o.value=x.category; o.textContent=x.category+' ('+x.count+')'; sel.appendChild(o);
    });
  }catch(e){}
}
function statBox(n,l,color){
  return '<div class="stat"><div class="n" style="color:'+(color||'var(--accent)')+'">'+n+'</div><div class="l">'+l+'</div></div>';
}
function checkLabel(r){
  if(r.check_status==='overdue') return '检查逾期 '+(-r.check_days_left)+' 天';
  if(r.check_status==='soon') return '距下次检查 '+r.check_days_left+' 天';
  if(r.check_status==='ok') return '距下次检查 '+r.check_days_left+' 天';
  return '无下次检查';
}
function render(){
  const box=$('list'); box.innerHTML='';
  if(!repairs.length){ box.innerHTML='<div class="empty">还没有维修记录。<br>点击右上角「＋ 新增记录」，登记水电、电器、墙面等问题与花费，临近复检会自动提醒。</div>'; return; }
  repairs.forEach(r=>{
    const el=document.createElement('div'); el.className='card';
    const meta=[];
    if(r.location) meta.push('📍 '+r.location);
    if(r.date) meta.push('🗓 '+r.date);
    if(r.cost) meta.push('💰 ¥'+r.cost);
    el.innerHTML =
      '<div class="top"><div class="title"></div><span class="badge"></span></div>'+
      '<div style="margin:6px 0"><span class="sbadge '+r.status+'"></span> <span class="exp '+r.check_status+'"></span></div>'+
      (meta.length?'<div class="meta"></div>':'')+
      (r.notes?'<div class="meta" style="margin-top:4px"></div>':'');
    el.querySelector('.title').textContent=r.title;
    el.querySelector('.badge').textContent=r.category;
    el.querySelector('.sbadge').textContent=r.status;
    el.querySelector('.exp').textContent=checkLabel(r);
    if(meta.length) el.querySelector('.meta').textContent=meta.join(' · ');
    const metas=el.querySelectorAll('.meta');
    if(r.notes) metas[metas.length-1].textContent='📝 '+r.notes;
    el.onclick=()=>openModal(r);
    box.appendChild(el);
  });
}
function openModal(r){
  editingId = r ? r.id : null;
  $('modalTitle').textContent = r ? '编辑记录' : '新增记录';
  $('mTitle').value = r?(r.title||''):'';
  $('mLocation').value = r?(r.location||''):'';
  $('mCategory').value = r?(r.category||'其他'):'其他';
  $('mDate').value = r?(r.date||''):'';
  $('mCost').value = r?(r.cost||0):0;
  $('mStatus').value = r?(r.status||'已完成'):'已完成';
  $('mNext').value = r?(r.next_check||''):'';
  $('mNotes').value = r?(r.notes||''):'';
  $('mDelete').style.display = r?'inline-block':'none';
  $('modal').classList.add('show');
}
$('addBtn').onclick=()=>openModal(null);
$('mCancel').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',(e)=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
$('mSave').onclick=async()=>{
  const payload={
    title:$('mTitle').value.trim(), location:$('mLocation').value.trim(),
    category:$('mCategory').value, date:$('mDate').value,
    cost:parseFloat($('mCost').value||'0')||0, status:$('mStatus').value,
    next_check:$('mNext').value, notes:$('mNotes').value.trim()
  };
  if(!payload.title){ showBanner('标题必填'); return; }
  try{
    if(editingId) await api('/repairs/'+editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/repairs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('modal').classList.remove('show'); await load(); await loadStats(); await loadCategories();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
$('mDelete').onclick=async()=>{
  if(!editingId) return;
  if(!confirm('删除该记录？')) return;
  try{ await api('/repairs/'+editingId,{method:'DELETE'}); $('modal').classList.remove('show'); await load(); await loadStats(); }
  catch(e){ showBanner('删除失败：'+e.message); }
};
$('search').oninput=load;
$('filterCategory').onchange=load;
$('filterStatus').onchange=load;
loadCategories(); loadStats(); load();
</script>
</body>
</html>
