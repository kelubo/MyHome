<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藏书馆 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#7c3aed; --accent2:#6d28d9; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar input,.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fafbff;outline:none}
.stats{display:flex;gap:10px;padding:0 22px 14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:90px;text-align:center}
.stat .n{font-size:22px;font-weight:800;color:var(--accent)}
.stat .l{font-size:12px;color:var(--muted)}
.wrap{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(124,58,237,.12)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .title{font-size:17px;font-weight:700;flex:1;line-height:1.3}
.card .author{color:var(--muted);font-size:13px;margin-bottom:8px}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#f3e8ff;color:var(--accent);font-weight:600}
.badge2{font-size:11px;padding:3px 9px;border-radius:20px;background:#e0f2fe;color:#0369a1;font-weight:600}
.badge2.out{background:#fee2e2;color:#b91c1c}
.stars{color:#f59e0b;font-size:14px;letter-spacing:1px}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row .field{flex:1}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">📚</div>
  <h1>图书管理</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="搜书名 / 作者 / ISBN" style="min-width:220px">
  <select id="filterCategory"><option value="">全部分类</option></select>
  <select id="filterStatus">
    <option value="">全部状态</option>
    <option>想读</option><option>在读</option><option>已读</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="addBtn">＋ 新增藏书</button>
</div>

<div class="stats" id="stats"></div>

<div class="wrap" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">新增藏书</h3>
    <div class="field"><label>书名 *</label><input type="text" id="mTitle" placeholder="如：人类简史"></div>
    <div class="row">
      <div class="field"><label>作者</label><input type="text" id="mAuthor" placeholder="作者"></div>
      <div class="field"><label>分类</label><input type="text" id="mCategory" placeholder="如：历史 / 科幻" list="catList"></div>
    </div>
    <div class="row">
      <div class="field"><label>状态</label>
        <select id="mStatus"><option>想读</option><option>在读</option><option>已读</option></select>
      </div>
      <div class="field"><label>评分(0~5)</label><input type="number" id="mRating" min="0" max="5" value="0"></div>
    </div>
    <div class="row">
      <div class="field"><label>出版社</label><input type="text" id="mPublisher"></div>
      <div class="field"><label>出版年</label><input type="number" id="mYear" placeholder="如 2014"></div>
    </div>
    <div class="row">
      <div class="field"><label>借阅状态</label>
        <select id="mBorrow"><option>在库</option><option>借出</option></select>
      </div>
      <div class="field"><label>出版日期</label><input type="text" id="mPublish" placeholder="如 2014 或 2014-05-01"></div>
    </div>
    <div class="field"><label>ISBN</label><input type="text" id="mIsbn"></div>
    <div class="field"><label>备注</label><textarea id="mNotes" placeholder="读后感、藏书架位等"></textarea></div>
    <datalist id="catList"></datalist>
    <div class="acts">
      <button class="btn" id="mSave">💾 保存</button>
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete" style="display:none">🗑 删除</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/books/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function starStr(n){ n=Math.max(0,Math.min(5,n|0)); return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n); }

let books = [];
let editingId = null;

async function load(){
  const q=$('search').value.trim(), c=$('filterCategory').value, s=$('filterStatus').value;
  const qs=[]; if(q) qs.push('q='+encodeURIComponent(q)); if(c) qs.push('category='+encodeURIComponent(c)); if(s) qs.push('status='+encodeURIComponent(s));
  try{
    books = await api('/books'+(qs.length?'?'+qs.join('&'):''));
    hideBanner();
  }catch(e){
    books=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 books-api 后端与 books 数据库）。');
  }
  render();
}
async function loadStats(){
  try{ const st=await api('/stats');
    $('stats').innerHTML =
      statBox(st.想读,'想读')+statBox(st.在读,'在读')+statBox(st.已读,'已读')+statBox(st.total,'总计');
  }catch(e){}
}
async function loadCategories(){
  try{
    const cs=await api('/categories');
    const sel=$('filterCategory'); cs.forEach(x=>{ const o=document.createElement('option'); o.value=x.category; o.textContent=x.category+' ('+x.count+')'; sel.appendChild(o);
      const o2=document.createElement('option'); o2.value=x.category; o2.textContent=x.category; $('catList').appendChild(o2); });
  }catch(e){}
}
function statBox(n,l){ return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
function render(){
  const box=$('list'); box.innerHTML='';
  if(!books.length){ box.innerHTML='<div class="empty">图书管理还空空如也。<br>点击右上角「＋ 新增藏书」，登记书名、作者、分类与阅读状态。</div>'; return; }
  books.forEach(b=>{
    const el=document.createElement('div'); el.className='card';
    const meta=[];
    if(b.publisher) meta.push(b.publisher);
    if(b.publish_date) meta.push('出版 '+b.publish_date);
    else if(b.year) meta.push(b.year+'年');
    if(b.isbn) meta.push('ISBN '+b.isbn);
    el.innerHTML =
      '<div class="top"><div class="title"></div><span class="badge"></span><span class="badge2"></span></div>'+
      '<div class="author"></div>'+
      '<div class="stars">'+(b.rating?starStr(b.rating):'<span style="color:var(--muted)">未评分</span>')+'</div>'+
      (meta.length?'<div class="meta"></div>':'')+
      (b.notes?'<div class="meta" style="margin-top:4px"></div>':'');
    el.querySelector('.title').textContent=b.title;
    el.querySelector('.badge').textContent=b.status;
    const bb=el.querySelector('.badge2');
    bb.textContent=b.borrow_status||'在库';
    bb.className='badge2'+((b.borrow_status||'在库')==='借出'?' out':'');
    el.querySelector('.author').textContent=b.author||'佚名';
    if(meta.length) el.querySelector('.meta').textContent=meta.join(' · ');
    if(b.notes) el.querySelectorAll('.meta')[b.publisher||b.year||b.isbn?1:0].textContent=b.notes;
    el.onclick=()=>openModal(b);
    box.appendChild(el);
  });
}
function openModal(b){
  editingId = b ? b.id : null;
  $('modalTitle').textContent = b ? '编辑藏书' : '新增藏书';
  $('mTitle').value = b?(b.title||''):'';
  $('mAuthor').value = b?(b.author||''):'';
  $('mCategory').value = b?(b.category||'其他'):'';
  $('mStatus').value = b?(b.status||'想读'):'想读';
  $('mRating').value = b?(b.rating||0):0;
  $('mPublisher').value = b?(b.publisher||''):'';
  $('mYear').value = b?(b.year||''):'';
  $('mBorrow').value = b?(b.borrow_status||'在库'):'在库';
  $('mPublish').value = b?(b.publish_date||''):'';
  $('mIsbn').value = b?(b.isbn||''):'';
  $('mNotes').value = b?(b.notes||''):'';
  $('mDelete').style.display = b?'inline-block':'none';
  $('modal').classList.add('show');
}
$('addBtn').onclick=()=>openModal(null);
$('mCancel').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',(e)=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
$('mSave').onclick=async()=>{
  const payload={
    title:$('mTitle').value.trim(), author:$('mAuthor').value.trim(), category:$('mCategory').value.trim()||'其他',
    status:$('mStatus').value, rating:parseInt($('mRating').value||'0',10), publisher:$('mPublisher').value.trim(),
    year:parseInt($('mYear').value||'0',10)||0, borrow_status:$('mBorrow').value, publish_date:$('mPublish').value.trim(),
    isbn:$('mIsbn').value.trim(), notes:$('mNotes').value.trim()
  };
  if(!payload.title){ showBanner('书名必填'); return; }
  try{
    if(editingId) await api('/books/'+editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/books',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('modal').classList.remove('show'); await load(); await loadStats(); await loadCategories();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
$('mDelete').onclick=async()=>{
  if(!editingId) return;
  if(!confirm('删除该藏书？')) return;
  try{ await api('/books/'+editingId,{method:'DELETE'}); $('modal').classList.remove('show'); await load(); await loadStats(); }
  catch(e){ showBanner('删除失败：'+e.message); }
};
$('search').oninput=load;
$('filterCategory').onchange=load;
$('filterStatus').onchange=load;
loadCategories(); loadStats(); load();
</script>
</body>
</html>
