<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影视清单 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#db2777; --accent2:#be185d; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar input,.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fafbff;outline:none}
.stats{display:flex;gap:10px;padding:0 22px 14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:90px;text-align:center}
.stat .n{font-size:22px;font-weight:800;color:var(--accent)}
.stat .l{font-size:12px;color:var(--muted)}
.wrap{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(219,39,119,.12)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .title{font-size:17px;font-weight:700;flex:1;line-height:1.3}
.card .author{color:var(--muted);font-size:13px;margin-bottom:8px}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#fce7f3;color:var(--accent);font-weight:600}
.stars{color:#f59e0b;font-size:14px;letter-spacing:1px}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row .field{flex:1}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🎬</div>
  <h1>影视清单</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="搜片名" style="min-width:200px">
  <select id="filterType"><option value="">全部类型</option></select>
  <select id="filterStatus">
    <option value="">全部状态</option>
    <option>想看</option><option>在看</option><option>已看</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="addBtn">＋ 新增</button>
</div>

<div class="stats" id="stats"></div>

<div class="wrap" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">新增影视</h3>
    <div class="row">
      <div class="field"><label>片名 *</label><input type="text" id="mTitle" placeholder="如：星际穿越"></div>
      <div class="field"><label>类型</label>
        <select id="mType"><option>电影</option><option>剧集</option><option>综艺</option><option>纪录片</option><option>其他</option></select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>平台</label><input type="text" id="mPlatform" placeholder="如 腾讯视频 / B站" list="pfList"></div>
      <div class="field"><label>状态</label>
        <select id="mStatus"><option>想看</option><option>在看</option><option>已看</option></select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>评分(0~5)</label><input type="number" id="mRating" min="0" max="5" value="0"></div>
      <div class="field"><label>年份</label><input type="number" id="mYear" placeholder="如 2014"></div>
    </div>
    <div class="row" id="progressRow">
      <div class="field"><label>季数</label><input type="number" id="mSeasons" min="0" value="0"></div>
      <div class="field"><label>看到第几集</label><input type="number" id="mEpisode" min="0" value="0"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="mNotes" placeholder="观后感、演员等"></textarea></div>
    <datalist id="pfList"></datalist>
    <div class="acts">
      <button class="btn" id="mSave">💾 保存</button>
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete" style="display:none">🗑 删除</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/films/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function starStr(n){ n=Math.max(0,Math.min(5,n|0)); return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n); }

let films = [];
let editingId = null;

async function load(){
  const q=$('search').value.trim(), t=$('filterType').value, s=$('filterStatus').value;
  const qs=[]; if(q) qs.push('q='+encodeURIComponent(q)); if(t) qs.push('type='+encodeURIComponent(t)); if(s) qs.push('status='+encodeURIComponent(s));
  try{
    films = await api('/films'+(qs.length?'?'+qs.join('&'):''));
    hideBanner();
  }catch(e){
    films=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 films-api 后端与 films 数据库）。');
  }
  render();
}
async function loadStats(){
  try{ const st=await api('/stats');
    $('stats').innerHTML =
      statBox(st.想看,'想看')+statBox(st.在看,'在看')+statBox(st.已看,'已看')+statBox(st.total,'总计');
  }catch(e){}
}
async function loadTypes(){
  try{
    const ts=await api('/types');
    const sel=$('filterType');
    ts.forEach(x=>{ const o=document.createElement('option'); o.value=x.type; o.textContent=x.type+' ('+x.count+')'; sel.appendChild(o); });
    const pfs=await api('/films'); // 平台去重
  }catch(e){}
}
async function loadPlatforms(){
  try{
    const fs=await api('/films');
    const set=new Set(); fs.forEach(f=>{ if(f.platform) set.add(f.platform); });
    const dl=$('pfList'); set.forEach(p=>{ const o=document.createElement('option'); o.value=p; dl.appendChild(o); });
  }catch(e){}
}
function statBox(n,l){ return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
function render(){
  const box=$('list'); box.innerHTML='';
  if(!films.length){ box.innerHTML='<div class="empty">影视清单还空空如也。<br>点击右上角「＋ 新增」，登记想看 / 在看 / 已看的电影剧集。</div>'; return; }
  films.forEach(f=>{
    const el=document.createElement('div'); el.className='card';
    const meta=[];
    if(f.platform) meta.push('📺 '+f.platform);
    if(f.year) meta.push(f.year+'年');
    if(f.ftype==='剧集' && (f.seasons||f.episode)) meta.push('第'+Math.max(f.seasons,1)+'季 看到第'+(f.episode||0)+'集');
    el.innerHTML =
      '<div class="top"><div class="title"></div><span class="badge"></span></div>'+
      '<div class="author"></div>'+
      '<div class="stars">'+(f.rating?starStr(f.rating):'<span style="color:var(--muted)">未评分</span>')+'</div>'+
      (meta.length?'<div class="meta"></div>':'')+
      (f.notes?'<div class="meta" style="margin-top:4px"></div>':'');
    el.querySelector('.title').textContent=f.title;
    el.querySelector('.badge').textContent=f.status;
    el.querySelector('.author').textContent=f.ftype||'电影';
    const metas=el.querySelectorAll('.meta');
    if(meta.length) metas[0].textContent=meta.join(' · ');
    if(f.notes) metas[metas.length-1].textContent=f.notes;
    el.onclick=()=>openModal(f);
    box.appendChild(el);
  });
}
function openModal(f){
  editingId = f ? f.id : null;
  $('modalTitle').textContent = f ? '编辑影视' : '新增影视';
  $('mTitle').value = f?(f.title||''):'';
  $('mType').value = f?(f.ftype||'电影'):'电影';
  $('mPlatform').value = f?(f.platform||''):'';
  $('mStatus').value = f?(f.status||'想看'):'想看';
  $('mRating').value = f?(f.rating||0):0;
  $('mYear').value = f?(f.year||''):'';
  $('mSeasons').value = f?(f.seasons||0):0;
  $('mEpisode').value = f?(f.episode||0):0;
  $('mNotes').value = f?(f.notes||''):'';
  $('mDelete').style.display = f?'inline-block':'none';
  $('modal').classList.add('show');
}
$('addBtn').onclick=()=>openModal(null);
$('mCancel').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',(e)=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
$('mSave').onclick=async()=>{
  const payload={
    title:$('mTitle').value.trim(), ftype:$('mType').value, platform:$('mPlatform').value.trim()||'其他',
    status:$('mStatus').value, rating:parseInt($('mRating').value||'0',10), year:parseInt($('mYear').value||'0',10)||0,
    seasons:parseInt($('mSeasons').value||'0',10)||0, episode:parseInt($('mEpisode').value||'0',10)||0, notes:$('mNotes').value.trim()
  };
  if(!payload.title){ showBanner('片名必填'); return; }
  try{
    if(editingId) await api('/films/'+editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/films',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('modal').classList.remove('show'); await load(); await loadStats();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
$('mDelete').onclick=async()=>{
  if(!editingId) return;
  if(!confirm('删除该影视？')) return;
  try{ await api('/films/'+editingId,{method:'DELETE'}); $('modal').classList.remove('show'); await load(); await loadStats(); }
  catch(e){ showBanner('删除失败：'+e.message); }
};
$('search').oninput=load;
$('filterType').onchange=load;
$('filterStatus').onchange=load;
loadTypes(); loadPlatforms(); loadStats(); load();
</script>
</body>
</html>
