<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭证件档案 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#0d9488; --accent2:#0f766e; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar input,.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fafbff;outline:none}
.stats{display:flex;gap:10px;padding:0 22px 14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:90px;text-align:center}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.wrap{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(13,148,136,.12)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .title{font-size:17px;font-weight:700;flex:1;line-height:1.3}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#ccfbf1;color:#0f766e;font-weight:600}
.exp{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.exp.ok{background:#eef2f7;color:var(--muted)}
.exp.soon{background:#fef3c7;color:#d97706}
.exp.overdue{background:#fde2e2;color:#dc2626}
.exp.none{background:#eef2f7;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row .field{flex:1}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🪪</div>
  <h1>家庭证件档案</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="搜名称 / 持有人 / 证件号 / 签发机关" style="min-width:220px">
  <select id="filterCategory"><option value="">全部分类</option></select>
  <select id="filterStatus">
    <option value="">全部状态</option>
    <option value="ok">正常</option>
    <option value="soon">临期</option>
    <option value="overdue">已过期</option>
    <option value="none">长期</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="addBtn">＋ 新增证件</button>
</div>

<div class="stats" id="stats"></div>

<div class="wrap" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">新增证件</h3>
    <div class="field"><label>证件名称 *</label><input type="text" id="mName" placeholder="如 居民身份证"></div>
    <div class="row">
      <div class="field"><label>分类</label>
        <select id="mCategory"><option>身份证</option><option>护照</option><option>户口本</option><option>房产证</option><option>驾照</option><option>结婚证</option><option>营业执照</option><option>其他</option></select>
      </div>
      <div class="field"><label>持有人</label><input type="text" id="mHolder" placeholder="如 爸爸 / 家庭"></div>
    </div>
    <div class="field"><label>证件号</label><input type="text" id="mNumber" placeholder="建议脱敏存储，如 1101********1234"></div>
    <div class="field"><label>签发机关</label><input type="text" id="mIssuer" placeholder="如 公安分局"></div>
    <div class="row">
      <div class="field"><label>签发日</label><input type="date" id="mIssue"></div>
      <div class="field"><label>到期日（长期留空）</label><input type="date" id="mExpire"></div>
    </div>
    <div class="row">
      <div class="field"><label>提前提醒(天)</label><input type="number" id="mRemind" value="90"></div>
      <div class="field"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="mNotes" placeholder="存放位置、换发提示等"></textarea></div>
    <div class="acts">
      <button class="btn" id="mSave">💾 保存</button>
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete" style="display:none">🗑 删除</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/certs/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

let certs = [];
let editingId = null;

async function load(){
  const q=$('search').value.trim(), c=$('filterCategory').value, s=$('filterStatus').value;
  const qs=[]; if(q) qs.push('q='+encodeURIComponent(q)); if(c) qs.push('category='+encodeURIComponent(c)); if(s) qs.push('status='+encodeURIComponent(s));
  try{
    certs = await api('/certs'+(qs.length?'?'+qs.join('&'):''));
    hideBanner();
  }catch(e){
    certs=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 certs-api 后端与 certs 数据库）。');
  }
  render();
}
async function loadStats(){
  try{
    const st=await api('/stats');
    $('stats').innerHTML =
      statBox(st.total,'证件总数')+
      statBox(st.expiring,'临期','#d97706')+
      statBox(st.expired,'已过期','#dc2626');
  }catch(e){}
}
async function loadCategories(){
  try{
    const cs=await api('/categories');
    const sel=$('filterCategory');
    cs.forEach(x=>{
      const o=document.createElement('option'); o.value=x.category; o.textContent=x.category+' ('+x.count+')'; sel.appendChild(o);
    });
  }catch(e){}
}
function statBox(n,l,color){
  return '<div class="stat"><div class="n" style="color:'+(color||'var(--accent)')+'">'+n+'</div><div class="l">'+l+'</div></div>';
}
function expLabel(c){
  if(c.exp_status==='overdue') return '已过期 '+(-c.exp_days_left)+' 天';
  if(c.exp_status==='soon') return '距到期 '+c.exp_days_left+' 天';
  if(c.exp_status==='ok') return '距到期 '+c.exp_days_left+' 天';
  return '长期有效';
}
function render(){
  const box=$('list'); box.innerHTML='';
  if(!certs.length){ box.innerHTML='<div class="empty">还没有证件档案。<br>点击右上角「＋ 新增证件」，登记身份证/护照/房产证等并填写到期日，临期与过期会自动高亮提醒（扫描件可存入「家庭文档归档」）。</div>'; return; }
  certs.forEach(c=>{
    const el=document.createElement('div'); el.className='card';
    const meta=[];
    if(c.holder) meta.push('👤 '+c.holder);
    if(c.number) meta.push('📄 '+c.number);
    if(c.issuer) meta.push('🏛 '+c.issuer);
    el.innerHTML =
      '<div class="top"><div class="title"></div><span class="badge"></span></div>'+
      '<div style="margin:6px 0"><span class="exp '+c.exp_status+'"></span></div>'+
      (meta.length?'<div class="meta"></div>':'')+
      '<div class="meta"></div>'+
      (c.notes?'<div class="meta" style="margin-top:4px"></div>':'');
    el.querySelector('.title').textContent=c.name;
    el.querySelector('.badge').textContent=c.category;
    el.querySelector('.exp').textContent=expLabel(c);
    const metas=el.querySelectorAll('.meta');
    if(meta.length) metas[0].textContent=meta.join(' · ');
    metas[1].textContent=(c.issue_date?('签发 '+c.issue_date):'')+(c.expire_date?(' · 到期 '+c.expire_date):' · 长期');
    if(c.notes) metas[metas.length-1].textContent='📝 '+c.notes;
    el.onclick=()=>openModal(c);
    box.appendChild(el);
  });
}
function openModal(c){
  editingId = c ? c.id : null;
  $('modalTitle').textContent = c ? '编辑证件' : '新增证件';
  $('mName').value = c?(c.name||''):'';
  $('mCategory').value = c?(c.category||'其他'):'其他';
  $('mHolder').value = c?(c.holder||''):'';
  $('mNumber').value = c?(c.number||''):'';
  $('mIssuer').value = c?(c.issuer||''):'';
  $('mIssue').value = c?(c.issue_date||''):'';
  $('mExpire').value = c?(c.expire_date||''):'';
  $('mRemind').value = c?(c.remind_days||90):90;
  $('mNotes').value = c?(c.notes||''):'';
  $('mDelete').style.display = c?'inline-block':'none';
  $('modal').classList.add('show');
}
$('addBtn').onclick=()=>openModal(null);
$('mCancel').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',(e)=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
$('mSave').onclick=async()=>{
  const payload={
    name:$('mName').value.trim(), category:$('mCategory').value,
    holder:$('mHolder').value.trim(), number:$('mNumber').value.trim(),
    issuer:$('mIssuer').value.trim(),
    issue_date:$('mIssue').value, expire_date:$('mExpire').value,
    remind_days:parseInt($('mRemind').value||'90',10)||90,
    notes:$('mNotes').value.trim()
  };
  if(!payload.name){ showBanner('证件名称必填'); return; }
  try{
    if(editingId) await api('/certs/'+editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/certs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('modal').classList.remove('show'); await load(); await loadStats(); await loadCategories();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
$('mDelete').onclick=async()=>{
  if(!editingId) return;
  if(!confirm('删除该证件？')) return;
  try{ await api('/certs/'+editingId,{method:'DELETE'}); $('modal').classList.remove('show'); await load(); await loadStats(); await loadCategories(); }
  catch(e){ showBanner('删除失败：'+e.message); }
};
$('search').oninput=load;
$('filterCategory').onchange=load;
$('filterStatus').onchange=load;
loadCategories(); loadStats(); load();
</script>
</body>
</html>
