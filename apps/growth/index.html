<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孩子成长日志 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#ec4899; --accent2:#db2777; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar input,.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fafbff;outline:none}
.stats{display:flex;gap:10px;padding:0 22px 14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:90px;text-align:center}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.childtabs{display:flex;gap:8px;padding:0 22px 12px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.timeline{padding:0 22px 30px;max-width:760px;margin:0 auto}
.tl-item{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl-item::before{content:'';position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.dot{width:16px;height:16px;border-radius:50%;background:var(--accent);margin-top:3px;flex:none;box-shadow:0 0 0 4px #fce7f3;z-index:1}
.tl-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;flex:1;cursor:pointer;transition:.15s}
.tl-card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(236,72,153,.12)}
.tl-card .h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tl-card .h .t{font-size:16px;font-weight:700;flex:1}
.cbadge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.cbadge.身高{background:#dbeafe;color:#2563eb}
.cbadge.体重{background:#dcfce7;color:#16a34a}
.cbadge.疫苗{background:#fef3c7;color:#b45309}
.cbadge.里程碑{background:#fce7f3;color:#db2777}
.cbadge.其他{background:#eef2f7;color:var(--muted)}
.tl-card .v{font-size:13px;color:var(--accent);font-weight:600}
.tl-card .d{font-size:12px;color:var(--muted)}
.tl-card .n{font-size:12px;color:var(--muted);margin-top:5px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row .field{flex:1}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🧸</div>
  <h1>孩子成长日志</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="搜标题 / 备注" style="min-width:180px">
  <select id="filterCategory">
    <option value="">全部分类</option>
    <option>身高</option><option>体重</option><option>疫苗</option><option>里程碑</option><option>其他</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="addBtn">＋ 新增记录</button>
</div>

<div class="stats" id="stats"></div>
<div class="childtabs" id="childTabs"></div>

<div class="timeline" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">新增记录</h3>
    <div class="row">
      <div class="field"><label>孩子名字 *</label><input type="text" id="mChild" placeholder="如 宝宝" list="childList"></div>
      <div class="field"><label>日期</label><input type="date" id="mDate"></div>
    </div>
    <div class="row">
      <div class="field"><label>分类</label>
        <select id="mCategory"><option>里程碑</option><option>身高</option><option>体重</option><option>疫苗</option><option>其他</option></select>
      </div>
      <div class="field"><label>数值</label><input type="text" id="mValue" placeholder="如 85cm / 12.5kg"></div>
    </div>
    <div class="field"><label>标题 / 事件</label><input type="text" id="mTitle" placeholder="如 第一次走路 / 周岁体检"></div>
    <div class="field"><label>备注</label><textarea id="mNotes" placeholder="详细情况、接种单位等"></textarea></div>
    <datalist id="childList"></datalist>
    <div class="acts">
      <button class="btn" id="mSave">💾 保存</button>
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete" style="display:none">🗑 删除</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/growth/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

let records = [];
let editingId = null;
let activeChild = '';

async function load(){
  const q=$('search').value.trim(), c=$('filterCategory').value;
  const qs=[]; if(q) qs.push('q='+encodeURIComponent(q)); if(c) qs.push('category='+encodeURIComponent(c));
  try{
    let all = await api('/records'+(qs.length?'?'+qs.join('&'):''));
    records = activeChild ? all.filter(r=>r.child===activeChild) : all;
    hideBanner();
  }catch(e){
    records=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 growth-api 后端与 growth 数据库）。');
  }
  render();
}
async function loadStats(){
  try{
    const st=await api('/stats');
    const pc=st.per_child||{};
    let childHtml='<div class="chip'+(activeChild===''?' active':'')+'" data-c="">全部 ('+st.total+')</div>';
    Object.keys(pc).forEach(ch=>{
      childHtml+='<div class="chip'+(activeChild===ch?' active':'')+'" data-c="'+ch.replace(/"/g,'&quot;')+'">'+ch+' ('+pc[ch]+')</div>';
    });
    $('childTabs').innerHTML=childHtml;
    $('childTabs').querySelectorAll('.chip').forEach(el=>{
      el.onclick=()=>{ activeChild=el.getAttribute('data-c'); loadStats(); load(); };
    });
    $('stats').innerHTML =
      statBox(st.total,'记录总数')+statBox(st.children,'孩子数');
  }catch(e){}
}
async function loadChildrenDatalist(){
  try{
    const cs=await api('/children');
    const dl=$('childList');
    cs.forEach(x=>{ const o=document.createElement('option'); o.value=x.child; dl.appendChild(o); });
  }catch(e){}
}
function statBox(n,l,color){
  return '<div class="stat"><div class="n" style="color:'+(color||'var(--accent)')+'">'+n+'</div><div class="l">'+l+'</div></div>';
}
function render(){
  const box=$('list'); box.innerHTML='';
  if(!records.length){ box.innerHTML='<div class="empty">还没有成长记录。<br>点击右上角「＋ 新增记录」，按孩子记录身高体重、疫苗、第一次走路说话等里程碑，串成时光轴。</div>'; return; }
  records.forEach(r=>{
    const el=document.createElement('div'); el.className='tl-item';
    const val = r.value ? '<span class="v">'+r.value+'</span>' : '';
    el.innerHTML =
      '<div class="dot"></div>'+
      '<div class="tl-card"><div class="h"><span class="t"></span><span class="cbadge '+r.category+'"></span></div>'+
      '<div class="d"></div>'+(val?'<div class="d" style="margin-top:2px"></div>':'')+
      (r.notes?'<div class="n"></div>':'');
    el.querySelector('.t').textContent=r.title||r.category;
    el.querySelector('.cbadge').textContent=r.category;
    el.querySelector('.d').textContent=(r.child?r.child+' · ':'')+(r.date||'');
    if(val){ const ds=el.querySelectorAll('.d'); if(ds[1]) ds[1].textContent=val; }
    if(r.notes) el.querySelector('.n').textContent='📝 '+r.notes;
    el.querySelector('.tl-card').onclick=()=>openModal(r);
    box.appendChild(el);
  });
}
function openModal(r){
  editingId = r ? r.id : null;
  $('modalTitle').textContent = r ? '编辑记录' : '新增记录';
  $('mChild').value = r?(r.child||''):(activeChild||'');
  $('mDate').value = r?(r.date||''):'';
  $('mCategory').value = r?(r.category||'里程碑'):'里程碑';
  $('mValue').value = r?(r.value||''):'';
  $('mTitle').value = r?(r.title||''):'';
  $('mNotes').value = r?(r.notes||''):'';
  $('mDelete').style.display = r?'inline-block':'none';
  $('modal').classList.add('show');
}
$('addBtn').onclick=()=>openModal(null);
$('mCancel').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',(e)=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
$('mSave').onclick=async()=>{
  const payload={
    child:$('mChild').value.trim(), date:$('mDate').value,
    category:$('mCategory').value, value:$('mValue').value.trim(),
    title:$('mTitle').value.trim(), notes:$('mNotes').value.trim()
  };
  if(!payload.child){ showBanner('孩子名字必填'); return; }
  try{
    if(editingId) await api('/records/'+editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('modal').classList.remove('show'); await load(); await loadStats(); await loadChildrenDatalist();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
$('mDelete').onclick=async()=>{
  if(!editingId) return;
  if(!confirm('删除该记录？')) return;
  try{ await api('/records/'+editingId,{method:'DELETE'}); $('modal').classList.remove('show'); await load(); await loadStats(); }
  catch(e){ showBanner('删除失败：'+e.message); }
};
$('search').oninput=load;
$('filterCategory').onchange=load;
loadChildrenDatalist(); loadStats(); load();
</script>
</body>
</html>
