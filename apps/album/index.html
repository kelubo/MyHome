<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭相册 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#2563eb; --accent2:#1d4ed8; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;
  background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;
  padding:10px 22px;font-size:13px;display:none}
.layout{display:flex;align-items:stretch;min-height:calc(100vh - 56px)}
/* 侧栏 */
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--line);
  background:var(--card);padding:16px;display:flex;flex-direction:column;gap:10px}
.sidebar h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:4px 2px}
.album-add{display:flex;gap:8px}
.album-add input{flex:1;padding:8px 10px;border-radius:9px;border:1px solid var(--line);
  font-size:13px;outline:none;background:#fafbff}
.album-add input:focus{border-color:var(--accent)}
.album-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:-2px}
.album-item{display:flex;align-items:center;gap:10px;background:#fafbff;border:1px solid var(--line);
  border-radius:10px;padding:8px;cursor:pointer;transition:.12s}
.album-item:hover{border-color:var(--accent);background:#f0f5ff}
.album-item.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.album-item .cov{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#e9edf5;flex-shrink:0}
.album-item .nm{flex:1;min-width:0}
.album-item .nm .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-item .nm .c{font-size:12px;color:var(--muted)}
.album-item .del{font-size:12px;padding:3px 8px;border-radius:7px;border:1px solid var(--line);
  background:#fff;cursor:pointer;color:var(--muted)}
.album-item .del:hover{border-color:var(--danger);color:var(--danger)}
.album-item .acts{display:flex;gap:4px;flex-shrink:0}
.album-sub{font-size:13px;color:var(--muted);background:#eef2ff;border:1px solid #dbe4ff;
  border-radius:10px;padding:8px 12px;margin-bottom:12px;line-height:1.6;display:none;
  white-space:pre-wrap}
/* 灯箱编辑表单布局 */
.lb-row{display:flex;gap:8px}
.lb-row label{flex:1;font-size:11px;color:#94a3b8;display:flex;flex-direction:column;gap:3px}
.lb-edit .field{margin:0}
/* 通用模态框（相册编辑） */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;
  align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(460px,92vw);
  box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{font-size:18px;margin-bottom:14px}
.modal-box .field{margin-bottom:12px}
.modal-box label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.modal-box input,.modal-box textarea{width:100%;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.modal-box input:focus,.modal-box textarea:focus{border-color:var(--accent)}
.modal-box .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
/* 主区 */
.main{flex:1;padding:18px 22px;overflow:auto;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .title{font-size:18px;font-weight:700}
.toolbar .count{color:var(--muted);font-size:13px}
.toolbar .spacer{flex:1}
.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;
  background:#fafbff;outline:none}
.toolbar select:focus{border-color:var(--accent)}
/* 网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cell{position:relative;aspect-ratio:1/1;background:#e9edf5;border-radius:12px;overflow:hidden;
  cursor:pointer;transition:.15s}
.cell:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(37,99,235,.18)}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:12px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:60px 10px;font-size:15px;line-height:2;
  border:2px dashed var(--line);border-radius:16px}
/* 拖拽提示 */
.dropzone.dragover{outline:3px dashed var(--accent);outline-offset:-10px;background:#eef4ff}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
/* 灯箱 */
.lightbox{position:fixed;inset:0;background:rgba(15,23,42,.92);display:none;z-index:50;
  align-items:center;justify-content:center;flex-direction:column}
.lightbox.show{display:flex}
.lb-img{max-width:90vw;max-height:78vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lb-bar{position:absolute;top:16px;right:16px;display:flex;gap:8px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);
  color:#fff;border:none;width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer}
.lb-nav:hover{background:rgba(255,255,255,.3)}
.lb-prev{left:18px}.lb-next{right:18px}
.lb-info{position:absolute;bottom:0;left:0;right:0;background:rgba(15,23,42,.85);color:#e5e7eb;
  padding:14px 20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.lb-info .meta{flex:1;min-width:220px}
.lb-info .meta .t{font-size:17px;font-weight:700;color:#fff}
.lb-info .meta .d{font-size:13px;margin-top:4px;line-height:1.6;white-space:pre-wrap}
.lb-info .acts{display:flex;gap:8px;flex-wrap:wrap}
.lb-edit{width:100%;display:none;flex-direction:column;gap:8px}
.lb-edit input,.lb-edit textarea,.lb-edit select{width:100%;padding:8px 10px;border-radius:9px;
  border:1px solid #475569;background:#1e293b;color:#e5e7eb;font-size:14px;outline:none}
.lb-edit textarea{min-height:64px;resize:vertical}
@media (max-width:820px){
  .layout{flex-direction:column}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);max-height:38vh}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo">📷</div>
  <h1>家庭相册</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="layout">
  <aside class="sidebar">
    <div class="album-add">
      <input type="text" id="newAlbum" placeholder="新相册名称…">
      <button class="btn" id="addAlbum" style="padding:8px 12px">＋</button>
    </div>
    <h3>相册</h3>
    <div class="album-list" id="albums"></div>
  </aside>

  <main class="main dropzone" id="dropzone">
    <div class="toolbar">
      <span class="title" id="viewTitle">全部照片</span>
      <span class="count" id="viewCount"></span>
      <div class="spacer"></div>
      <select id="uploadAlbum" title="上传到相册"></select>
      <button class="btn" id="uploadBtn">⬆ 上传</button>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    </div>
    <div class="album-sub" id="albumSub"></div>
    <div class="grid" id="grid"></div>
    <div class="hint">支持拖拽图片到此处上传；单文件上限 100MB，格式 jpg/png/gif/webp/bmp。照片与缩略图均存于服务器 ./data/album/。</div>
  </main>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <div class="lb-bar">
    <button class="btn ghost" id="lbClose" style="color:#fff;border-color:#64748b">✕ 关闭</button>
  </div>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <img class="lb-img" id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-info">
    <div class="meta" id="lbMeta">
      <div class="t" id="lbTitle"></div>
      <div class="d" id="lbDesc"></div>
    </div>
    <form class="lb-edit" id="lbEdit">
      <input type="text" id="lbEditTitle" placeholder="标题">
      <textarea id="lbEditDesc" placeholder="描述"></textarea>
      <textarea id="lbEditNotes" placeholder="备注（自由记录，如拍摄背景、故事等）"></textarea>
      <div class="lb-row">
        <label>拍照时间<input type="datetime-local" id="lbEditTaken"></label>
        <label>地点<input type="text" id="lbEditLocation" placeholder="如：杭州西湖"></label>
      </div>
      <div class="lb-row">
        <label>设备/相机<input type="text" id="lbEditCamera" placeholder="如：iPhone 15"></label>
        <label>人物<input type="text" id="lbEditPeople" placeholder="逗号分隔，如：爸爸,妈妈"></label>
      </div>
      <select id="lbEditAlbum"></select>
      <div class="acts">
        <button type="button" class="btn" id="lbSave">💾 保存</button>
        <button type="button" class="btn ghost" id="lbCancel" style="color:#fff;border-color:#64748b">取消</button>
        <button type="button" class="btn ghost" id="lbCover" style="color:#fff;border-color:#64748b">★ 设为封面</button>
        <button type="button" class="btn danger" id="lbDelete">🗑 删除</button>
      </div>
    </form>
    <div class="acts" id="lbViewActs">
      <button class="btn ghost" id="lbEditBtn" style="color:#fff;border-color:#64748b">✎ 编辑</button>
      <button class="btn ghost" id="lbCover2" style="color:#fff;border-color:#64748b">★ 设为封面</button>
      <button class="btn danger" id="lbDelete2">🗑 删除</button>
    </div>
  </div>
</div>

<!-- 相册编辑模态框 -->
<div class="modal" id="albumModal">
  <div class="modal-box">
    <h3 id="albumModalTitle">编辑相册</h3>
    <div class="field"><label>名称</label><input type="text" id="amName" placeholder="相册名称"></div>
    <div class="field"><label>说明（简短，侧栏展示）</label><textarea id="amDesc" placeholder="一句话说明"></textarea></div>
    <div class="field"><label>备注（较长自由文本）</label><textarea id="amNotes" placeholder="如：2026 年全家旅行合集……"></textarea></div>
    <div class="acts">
      <button class="btn" id="amSave">💾 保存</button>
      <button class="btn ghost" id="amCancel">取消</button>
      <button class="btn danger" id="amDelete">🗑 删除相册</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/album/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');

function showBanner(msg){ banner.textContent = msg; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
function esc(s){ return String(s==null?'':s); }
function fmtDate(s){ if(!s) return ''; return s.replace('T',' ').replace(/\.\d+$/,'').replace(/[Z+].*$/,''); }
function isoToLocalInput(s){ if(!s) return ''; return s.slice(0,16); }
function localInputToIso(v){ if(!v) return null; return v.replace('T',' ') + ':00'; }
function fmtSize(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}
const mediaUrl = (p) => API + '/media/' + p.filename;
const thumbUrl = (p) => p.thumb ? (API + '/thumbs/' + p.thumb) : mediaUrl(p);

async function api(path, opts){
  const r = await fetch(API + path, opts);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

let albums = [];
let photos = [];                 // 当前视图的照片（灯箱导航基于它）
let currentAlbum = null;         // null = 全部照片；否则相册 id
let lbIndex = -1;

// ── 加载相册 ──
async function loadAlbums(){
  try{ albums = await api('/albums'); }
  catch(e){ albums = []; }
  renderAlbums();
  renderUploadAlbum();
  renderEditAlbum();
}

function renderAlbums(){
  const box = $('albums');
  box.innerHTML = '';
  // 全部照片
  const all = document.createElement('div');
  all.className = 'album-item' + (currentAlbum===null ? ' active':'');
  all.innerHTML = '<div class="nm"><div class="t">🖼 全部照片</div><div class="c">所有相册合集</div></div>';
  all.onclick = () => { currentAlbum=null; loadPhotos(); };
  box.appendChild(all);
  albums.forEach(a => {
    const el = document.createElement('div');
    el.className = 'album-item' + (currentAlbum===a.id ? ' active':'');
    const cov = a.cover_thumb ? thumbUrl({thumb:a.cover_thumb, filename:a.cover_media}) : '';
    el.innerHTML =
      (cov ? '<img class="cov" src="'+cov+'" alt="">' : '<div class="cov"></div>') +
      '<div class="nm"><div class="t"></div><div class="c"></div></div>' +
      '<span class="acts"><button class="del" title="编辑相册">✎</button>' +
      '<button class="del" title="删除相册（同时删除其中照片）">✕</button></span>';
    el.querySelector('.t').textContent = a.name;
    el.querySelector('.c').textContent = a.count + ' 张';
    el.querySelector('.nm').onclick = () => { currentAlbum=a.id; loadPhotos(); };
    el.querySelectorAll('.del')[0].onclick = (e) => { e.stopPropagation(); openAlbumModal(a); };
    el.querySelectorAll('.del')[1].onclick = (e) => { e.stopPropagation(); delAlbum(a); };
    box.appendChild(el);
  });
}

function renderUploadAlbum(){
  const sel = $('uploadAlbum');
  const prev = sel.value;
  sel.innerHTML = '<option value="">未分类（不入相册）</option>';
  albums.forEach(a => {
    const o = document.createElement('option'); o.value=a.id; o.textContent=a.name; sel.appendChild(o);
  });
  // 默认选中当前视图相册
  sel.value = (currentAlbum!=null ? String(currentAlbum) : prev || '');
}

function renderEditAlbum(){
  const sel = $('lbEditAlbum');
  sel.innerHTML = '<option value="">未分类（不入相册）</option>';
  albums.forEach(a => { const o=document.createElement('option'); o.value=a.id; o.textContent=a.name; sel.appendChild(o); });
}

// ── 加载照片 ──
async function loadPhotos(){
  let path = '/photos?';
  if(currentAlbum!=null) path += 'album_id=' + encodeURIComponent(currentAlbum);
  try{
    photos = await api(path);
    hideBanner();
  }catch(e){
    photos = [];
    showBanner('⚠️ 无法连接后端 API（家庭相册需以 docker 集成模式启动，包含 album-api 后端与 album 数据库）。');
  }
  renderAlbums();
  renderUploadAlbum();
  $('viewTitle').textContent = currentAlbum==null ? '全部照片' : (albums.find(a=>a.id===currentAlbum)||{}).name || '相册';
  $('viewCount').textContent = photos.length ? ('共 ' + photos.length + ' 张') : '';
  const sub = $('albumSub');
  if(currentAlbum!=null){
    const a = albums.find(x=>x.id===currentAlbum);
    const txt = a ? [a.description, a.notes].filter(Boolean).join('\n') : '';
    sub.textContent = txt || '（这个相册还没有说明/备注）';
    sub.style.display = 'block';
  } else {
    sub.style.display = 'none';
    sub.textContent = '';
  }
  renderGrid();
}

function renderGrid(){
  const grid = $('grid');
  grid.innerHTML = '';
  if(!photos.length){
    grid.innerHTML = '<div class="empty">这里还没有照片。<br>点击右上角「⬆ 上传」，或把图片拖拽到此处。</div>';
    return;
  }
  photos.forEach((p, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = thumbUrl(p);
    img.alt = p.title || p.original;
    img.onerror = () => { img.src = mediaUrl(p); };
    cell.appendChild(img);
    if(p.title || p.description){
      const cap = document.createElement('div'); cap.className='cap';
      cap.textContent = p.title || p.original;
      cell.appendChild(cap);
    }
    cell.onclick = () => openLightbox(i);
    grid.appendChild(cell);
  });
}

// ── 上传 ──
$('uploadBtn').onclick = () => $('fileInput').click();
$('fileInput').addEventListener('change', (e)=>{ doUpload(e.target.files); e.target.value=''; });

async function doUpload(fileList){
  if(!fileList || !fileList.length) return;
  const fd = new FormData();
  for(const f of fileList) fd.append('files', f);
  const aid = $('uploadAlbum').value;
  if(aid) fd.append('album_id', aid);
  try{
    const r = await fetch(API + '/photos/upload', {method:'POST', body:fd});
    if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.error||('HTTP '+r.status)); }
    await loadPhotos();
  }catch(e){ showBanner('上传失败：' + e.message); }
}

// 拖拽上传
const dz = $('dropzone');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,(e)=>{e.preventDefault();dz.classList.add('dragover');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,(e)=>{e.preventDefault();dz.classList.remove('dragover');}));
dz.addEventListener('drop',(e)=>{ if(e.dataTransfer && e.dataTransfer.files) doUpload(e.dataTransfer.files); });

// ── 相册增删与编辑（模态框） ──
let editingAlbumId = null;
function openAlbumModal(a){
  editingAlbumId = a ? a.id : null;
  $('albumModalTitle').textContent = a ? '编辑相册' : '新建相册';
  $('amName').value = a ? a.name : '';
  $('amDesc').value = a ? (a.description || '') : '';
  $('amNotes').value = a ? (a.notes || '') : '';
  $('amDelete').style.display = a ? 'inline-block' : 'none';
  $('albumModal').classList.add('show');
}
$('addAlbum').onclick = () => {
  const v = $('newAlbum').value.trim();
  openAlbumModal(null);
  if(v) $('amName').value = v;
  $('newAlbum').value = '';
};
$('amCancel').onclick = () => $('albumModal').classList.remove('show');
$('albumModal').addEventListener('click',(e)=>{ if(e.target===$('albumModal')) $('albumModal').classList.remove('show'); });
$('amSave').onclick = async () => {
  const payload = {
    name: $('amName').value.trim() || '未命名相册',
    description: $('amDesc').value.trim(),
    notes: $('amNotes').value.trim(),
  };
  try{
    if(editingAlbumId){
      await api('/albums/'+editingAlbumId, {method:'PUT', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)});
    }else{
      await api('/albums', {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)});
    }
    $('albumModal').classList.remove('show');
    await loadAlbums();
  }catch(e){ showBanner('保存相册失败：' + e.message); }
};
$('amDelete').onclick = async () => {
  if(!editingAlbumId) return;
  const a = albums.find(x=>x.id===editingAlbumId);
  if(!confirm('删除相册《'+(a?a.name:'')+'》？其中的 '+((a?a.count:0))+' 张照片也会一并删除，不可撤销。')) return;
  try{
    await api('/albums/'+editingAlbumId, {method:'DELETE'});
    $('albumModal').classList.remove('show');
    if(currentAlbum===editingAlbumId) currentAlbum=null;
    await loadAlbums(); await loadPhotos();
  }catch(e){ showBanner('删除相册失败：' + e.message); }
};

async function delAlbum(a){
  if(!confirm('删除相册《'+a.name+'》？其中的 '+a.count+' 张照片也会一并删除，不可撤销。')) return;
  try{
    await api('/albums/'+a.id, {method:'DELETE'});
    if(currentAlbum===a.id) currentAlbum=null;
    await loadAlbums(); await loadPhotos();
  }catch(e){ showBanner('删除相册失败：' + e.message); }
}

// ── 灯箱 ──
function openLightbox(i){
  lbIndex = i;
  showLightbox();
}
function showLightbox(){
  const p = photos[lbIndex];
  if(!p) return;
  $('lbImg').src = mediaUrl(p);
  $('lbTitle').textContent = p.title || p.original;
  const lines = [];
  if(p.description) lines.push('📝 ' + p.description);
  if(p.taken_at) lines.push('📅 ' + fmtDate(p.taken_at));
  if(p.location) lines.push('📍 ' + p.location);
  if(p.camera) lines.push('📷 ' + p.camera);
  if(p.people) lines.push('👤 ' + p.people);
  if(p.notes) lines.push('💬 ' + p.notes);
  lines.push('🗂 ' + fmtSize(p.size));
  $('lbDesc').textContent = lines.join('\n');
  $('lightbox').classList.add('show');
  setLbEdit(false);
}
function closeLightbox(){ $('lightbox').classList.remove('show'); lbIndex=-1; }
function setLbEdit(on){
  $('lbEdit').style.display = on ? 'flex' : 'none';
  $('lbViewActs').style.display = on ? 'none' : 'flex';
  if(on){
    const p = photos[lbIndex];
    $('lbEditTitle').value = p.title || '';
    $('lbEditDesc').value = p.description || '';
    $('lbEditNotes').value = p.notes || '';
    $('lbEditTaken').value = isoToLocalInput(p.taken_at);
    $('lbEditLocation').value = p.location || '';
    $('lbEditCamera').value = p.camera || '';
    $('lbEditPeople').value = p.people || '';
    $('lbEditAlbum').value = p.album_id ? String(p.album_id) : '';
  }
}
$('lbClose').onclick = closeLightbox;
$('lightbox').addEventListener('click',(e)=>{ if(e.target===$('lightbox')) closeLightbox(); });
document.addEventListener('keydown',(e)=>{
  if(!$('lightbox').classList.contains('show')) return;
  if(e.key==='Escape') closeLightbox();
  else if(e.key==='ArrowLeft') navLightbox(-1);
  else if(e.key==='ArrowRight') navLightbox(1);
});
function navLightbox(d){
  if(!photos.length) return;
  lbIndex = (lbIndex + d + photos.length) % photos.length;
  showLightbox();
}
$('lbPrev').onclick = () => navLightbox(-1);
$('lbNext').onclick = () => navLightbox(1);

$('lbEditBtn').onclick = () => setLbEdit(true);
$('lbCancel').onclick = () => setLbEdit(false);

$('lbSave').onclick = async () => {
  const p = photos[lbIndex];
  const aid = $('lbEditAlbum').value;
  const payload = {
    title: $('lbEditTitle').value.trim(),
    description: $('lbEditDesc').value,
    notes: $('lbEditNotes').value,
    location: $('lbEditLocation').value.trim(),
    camera: $('lbEditCamera').value.trim(),
    people: $('lbEditPeople').value.trim(),
    taken_at: localInputToIso($('lbEditTaken').value),
    album_id: aid ? parseInt(aid,10) : null,
  };
  try{
    const updated = await api('/photos/'+p.id, {method:'PUT',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    photos[lbIndex] = updated;
    setLbEdit(false);
    showLightbox();
    await loadAlbums(); await loadPhotos();
  }catch(e){ showBanner('保存失败：' + e.message); }
};

async function setCover(){
  const p = photos[lbIndex];
  if(!p.album_id){ alert('该照片未归入相册，无法设为封面。请先编辑归入某个相册。'); return; }
  try{
    await api('/albums/'+p.album_id, {method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cover_id:p.id})});
    await loadAlbums();
    showBanner('已设为相册封面。'); hideBanner();
  }catch(e){ showBanner('设置封面失败：' + e.message); }
}
$('lbCover').onclick = setCover;
$('lbCover2').onclick = setCover;

async function delPhoto(){
  const p = photos[lbIndex];
  if(!confirm('删除这张照片？不可撤销。')) return;
  try{
    await api('/photos/'+p.id, {method:'DELETE'});
    photos.splice(lbIndex,1);
    if(!photos.length){ closeLightbox(); }
    else { lbIndex = Math.min(lbIndex, photos.length-1); showLightbox(); }
    await loadAlbums(); await loadPhotos();
  }catch(e){ showBanner('删除失败：' + e.message); }
}
$('lbDelete').onclick = delPhoto;
$('lbDelete2').onclick = delPhoto;

// 初始化
loadAlbums().then(loadPhotos);
</script>
</body>
</html>
