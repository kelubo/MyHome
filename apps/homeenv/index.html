<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭环境记录 · MyHome</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#0ea5e9; --accent2:#0284c7; --line:#e5e7eb; --radius:14px; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-size:26px}
header.top h1{font-size:20px}
header.top .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.banner{background:#fff4f4;color:var(--danger);border-bottom:1px solid #f3c9c9;padding:10px 22px;font-size:13px;display:none}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar input,.toolbar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fafbff;outline:none}
.stats{display:flex;gap:10px;padding:0 22px 14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:90px;text-align:center}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.rooms{padding:0 22px 6px}
.rooms h3,.listhead{padding:6px 0;font-size:14px;color:var(--muted)}
.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:8px}
.roomcard{background:linear-gradient(135deg,#e0f2fe,#f0f9ff);border:1px solid #bae6fd;border-radius:12px;padding:12px}
.roomcard .rn{font-weight:700;font-size:15px;margin-bottom:6px}
.roomcard .rv{font-size:12px;color:#075985;line-height:1.6}
.wrap{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(14,165,233,.12)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .title{font-size:17px;font-weight:700;flex:1;line-height:1.3}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#e0f2fe;color:#0369a1;font-weight:600}
.metrics{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.metric{font-size:13px}
.metric b{font-size:18px;color:var(--accent)}
.metric span{color:var(--muted);font-size:11px;display:block}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:60;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal-box h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none;background:#fafbff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row .field{flex:1}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🌡️</div>
  <h1>家庭环境记录</h1>
  <div class="spacer"></div>
  <a class="btn ghost" href="/portal/">← 门户</a>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="搜备注" style="min-width:180px">
  <select id="filterRoom"><option value="">全部房间</option></select>
  <div class="spacer"></div>
  <button class="btn" id="addBtn">＋ 新增记录</button>
</div>

<div class="stats" id="stats"></div>

<div class="rooms">
  <h3>各房间最新读数</h3>
  <div class="roomgrid" id="roomGrid"></div>
</div>

<div class="listhead" style="padding:6px 22px 0">全部记录（按时间倒序）</div>
<div class="wrap" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">新增记录</h3>
    <div class="row">
      <div class="field"><label>房间 / 区域 *</label><input type="text" id="mRoom" placeholder="如 客厅 / 主卧" list="roomList"></div>
      <div class="field"><label>记录时间</label><input type="datetime-local" id="mAt"></div>
    </div>
    <div class="row">
      <div class="field"><label>温度 ℃</label><input type="number" step="0.1" id="mTemp" placeholder="如 23.5"></div>
      <div class="field"><label>湿度 %</label><input type="number" step="0.1" id="mHum" placeholder="如 52"></div>
    </div>
    <div class="row">
      <div class="field"><label>PM2.5 μg/m³</label><input type="number" id="mPm" placeholder="如 18"></div>
      <div class="field"><label>CO₂ ppm</label><input type="number" id="mCo2" placeholder="如 620"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="mNotes" placeholder="如 体感舒适 / 注意通风"></textarea></div>
    <datalist id="roomList"></datalist>
    <div class="acts">
      <button class="btn" id="mSave">💾 保存</button>
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete" style="display:none">🗑 删除</button>
    </div>
  </div>
</div>

<script>
const API = '/apps/homeenv/api';
const $ = (id) => document.getElementById(id);
const banner = $('banner');
function showBanner(m){ banner.textContent=m; banner.style.display='block'; }
function hideBanner(){ banner.style.display='none'; }
async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

let records = [];
let editingId = null;

function fmtDateTime(s){
  if(!s) return '';
  const d=new Date(s);
  if(isNaN(d)) return s;
  const p=n=>(n<10?'0':'')+n;
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function toLocalInput(s){
  if(!s) return '';
  const d=new Date(s);
  if(isNaN(d)) return '';
  const p=n=>(n<10?'0':'')+n;
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}

async function load(){
  const q=$('search').value.trim(), room=$('filterRoom').value;
  const qs=[]; if(q) qs.push('q='+encodeURIComponent(q)); if(room) qs.push('room='+encodeURIComponent(room));
  try{
    records = await api('/records'+(qs.length?'?'+qs.join('&'):''));
    hideBanner();
  }catch(e){
    records=[]; showBanner('⚠️ 无法连接后端 API（此应用需以 docker 集成模式启动，含 homeenv-api 后端与 homeenv 数据库）。');
  }
  render();
}
async function loadStats(){
  try{
    const st=await api('/stats');
    $('stats').innerHTML =
      statBox(st.total,'记录总数')+statBox(st.rooms,'房间数')+
      statBox(st.avg_temp!=null?st.avg_temp+'℃':'—','平均温度')+
      statBox(st.avg_humidity!=null?st.avg_humidity+'%':'—','平均湿度');
  }catch(e){}
}
async function loadRooms(){
  try{
    const rs=await api('/rooms');
    const sel=$('filterRoom'); const dl=$('roomList');
    rs.forEach(x=>{
      const o=document.createElement('option'); o.value=x.room; o.textContent=x.room+' ('+x.count+')'; sel.appendChild(o);
      const o2=document.createElement('option'); o2.value=x.room; o2.textContent=x.room; dl.appendChild(o2);
    });
    const g=$('roomGrid'); g.innerHTML='';
    rs.forEach(x=>{
      const l=x.latest||{};
      const vals=[];
      if(l.temperature!=null) vals.push('🌡 '+l.temperature+'℃');
      if(l.humidity!=null) vals.push('💧 '+l.humidity+'%');
      if(l.pm25!=null) vals.push('PM2.5 '+l.pm25);
      if(l.co2!=null) vals.push('CO₂ '+l.co2);
      const el=document.createElement('div'); el.className='roomcard';
      el.innerHTML='<div class="rn"></div><div class="rv"></div>';
      el.querySelector('.rn').textContent=x.room+' · '+x.count+'条';
      el.querySelector('.rv').textContent = vals.length? vals.join('　') : '暂无数据';
      g.appendChild(el);
    });
  }catch(e){}
}
function statBox(n,l,color){
  return '<div class="stat"><div class="n" style="color:'+(color||'var(--accent)')+'">'+n+'</div><div class="l">'+l+'</div></div>';
}
function render(){
  const box=$('list'); box.innerHTML='';
  if(!records.length){ box.innerHTML='<div class="empty">还没有环境记录。<br>点击右上角「＋ 新增记录」，按房间登记温湿度、空气质量，长期跟踪家中环境变化。</div>'; return; }
  records.forEach(r=>{
    const el=document.createElement('div'); el.className='card';
    const metrics=[];
    if(r.temperature!=null) metrics.push('<div class="metric"><b>'+r.temperature+'</b><span>℃</span></div>');
    if(r.humidity!=null) metrics.push('<div class="metric"><b>'+r.humidity+'</b><span>%RH</span></div>');
    if(r.pm25!=null) metrics.push('<div class="metric"><b>'+r.pm25+'</b><span>PM2.5</span></div>');
    if(r.co2!=null) metrics.push('<div class="metric"><b>'+r.co2+'</b><span>CO₂</span></div>');
    el.innerHTML =
      '<div class="top"><div class="title"></div><span class="badge"></span></div>'+
      '<div class="meta"></div>'+
      (metrics.length?'<div class="metrics"></div>':'')+
      (r.notes?'<div class="meta" style="margin-top:6px"></div>':'');
    el.querySelector('.title').textContent=fmtDateTime(r.recorded_at);
    el.querySelector('.badge').textContent=r.room;
    el.querySelector('.meta').textContent='记录时间';
    if(metrics.length) el.querySelector('.metrics').innerHTML=metrics.join('');
    if(r.notes) el.querySelectorAll('.meta')[el.querySelectorAll('.meta').length-1].textContent='📝 '+r.notes;
    el.onclick=()=>openModal(r);
    box.appendChild(el);
  });
}
function openModal(r){
  editingId = r ? r.id : null;
  $('modalTitle').textContent = r ? '编辑记录' : '新增记录';
  $('mRoom').value = r?(r.room||''):'';
  $('mAt').value = r?toLocalInput(r.recorded_at):toLocalInput(new Date().toISOString());
  $('mTemp').value = r?(r.temperature!=null?r.temperature:''):'';
  $('mHum').value = r?(r.humidity!=null?r.humidity:''):'';
  $('mPm').value = r?(r.pm25!=null?r.pm25:''):'';
  $('mCo2').value = r?(r.co2!=null?r.co2:''):'';
  $('mNotes').value = r?(r.notes||''):'';
  $('mDelete').style.display = r?'inline-block':'none';
  $('modal').classList.add('show');
}
$('addBtn').onclick=()=>openModal(null);
$('mCancel').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',(e)=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
$('mSave').onclick=async()=>{
  const payload={
    room:$('mRoom').value.trim(), recorded_at:$('mAt').value,
    temperature:$('mTemp').value===''?'':parseFloat($('mTemp').value),
    humidity:$('mHum').value===''?'':parseFloat($('mHum').value),
    pm25:$('mPm').value===''?'':parseInt($('mPm').value,10),
    co2:$('mCo2').value===''?'':parseInt($('mCo2').value,10),
    notes:$('mNotes').value.trim()
  };
  if(!payload.room){ showBanner('房间/区域必填'); return; }
  try{
    if(editingId) await api('/records/'+editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    else await api('/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('modal').classList.remove('show'); await load(); await loadStats(); await loadRooms();
  }catch(e){ showBanner('保存失败：'+e.message); }
};
$('mDelete').onclick=async()=>{
  if(!editingId) return;
  if(!confirm('删除该记录？')) return;
  try{ await api('/records/'+editingId,{method:'DELETE'}); $('modal').classList.remove('show'); await load(); await loadStats(); await loadRooms(); }
  catch(e){ showBanner('删除失败：'+e.message); }
};
$('search').oninput=load;
$('filterRoom').onchange=load;
loadRooms(); loadStats(); load();
</script>
</body>
</html>
