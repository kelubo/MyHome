<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirHub - 智能家居网关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        h1 span {
            font-size: 32px;
            margin-right: 10px;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-safe { background: #4CAF50; color: white; }
        .status-warning { background: #FF9800; color: white; }
        .status-danger { background: #F44336; color: white; }
        .status-critical { background: #B71C1C; color: white; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-icon {
            font-size: 24px;
        }

        .card-value {
            font-size: 42px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .card-unit {
            font-size: 16px;
            color: #888;
        }

        .card-status {
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            display: inline-block;
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 18px;
            color: #333;
            font-weight: bold;
        }

        .time-range {
            display: flex;
            gap: 10px;
        }

        .time-btn {
            padding: 5px 15px;
            border: none;
            border-radius: 5px;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .time-btn.active {
            background: #667eea;
            color: white;
        }

        canvas {
            width: 100% !important;
            height: 300px !important;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            color: #666;
            font-size: 14px;
        }

        .info-value {
            font-weight: bold;
            color: #333;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><span>🏠</span>AirHub 智能家居网关</h1>
            <div class="status-badge status-safe" id="mainStatus">连接中...</div>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">一氧化碳 (CO)</span>
                    <span class="card-icon">💨</span>
                </div>
                <div class="card-value" id="coValue">--</div>
                <div class="card-unit">ppm</div>
                <div class="card-status" id="coStatus">--</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">硫化氢 (H2S)</span>
                    <span class="card-icon">⚗️</span>
                </div>
                <div class="card-value" id="h2sValue">--</div>
                <div class="card-unit">ppm</div>
                <div class="card-status" id="h2sStatus">--</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">PM2.5</span>
                    <span class="card-icon">🌫️</span>
                </div>
                <div class="card-value" id="pm25Value">--</div>
                <div class="card-unit">μg/m³</div>
                <div class="card-status" id="pm25Status">--</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">温湿度</span>
                    <span class="card-icon">🌡️</span>
                </div>
                <div class="card-value" id="tempValue">--°C</div>
                <div class="card-unit" id="humValue">湿度: --%</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-header">
                <span class="chart-title">📈 实时数据</span>
                <div class="time-range">
                    <button class="time-btn active" onclick="setTimeRange(1)">1小时</button>
                    <button class="time-btn" onclick="setTimeRange(6)">6小时</button>
                    <button class="time-btn" onclick="setTimeRange(24)">24小时</button>
                </div>
            </div>
            <canvas id="dataChart"></canvas>
        </div>

        <div class="card">
            <div class="chart-header">
                <span class="chart-title">📊 设备状态</span>
            </div>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">WiFi信号</span>
                    <span class="info-value" id="wifiRssi">-- dBm</span>
                </div>
                <div class="info-item">
                    <span class="info-label">运行时间</span>
                    <span class="info-value" id="uptime">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">最后更新</span>
                    <span class="info-value" id="lastUpdate">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">固件版本</span>
                    <span class="info-value">v1.0</span>
                </div>
            </div>
            <div class="controls">
                <button class="btn-primary" onclick="refreshData()">🔄 刷新数据</button>
                <button class="btn-secondary" onclick="toggleMute()">🔇 静音控制</button>
                <button class="btn-danger" onclick="resolveAlerts()">✓ 清除报警</button>
            </div>
        </div>

        <footer>
            <p>AirHub v1.0 | 智能家居网关系统</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script>
        // 配置
        const API_BASE = 'http://localhost:5000/api';
        let chart = null;
        let timeRange = 1; // 小时

        // 阈值配置
        const THRESHOLDS = {
            co: { warning: 25, danger: 50, critical: 100 },
            h2s: { warning: 10, danger: 20, critical: 50 },
            pm25: { warning: 75, danger: 150, critical: 250 }
        };

        // 获取状态等级
        function getAlertLevel(value, thresholds) {
            if (value >= thresholds.critical) return { level: 3, text: '危险', class: 'status-danger' };
            if (value >= thresholds.danger) return { level: 2, text: '警告', class: 'status-warning' };
            if (value >= thresholds.warning) return { level: 1, text: '注意', class: 'status-warning' };
            return { level: 0, text: '正常', class: 'status-safe' };
        }

        // 格式化时间
        function formatUptime(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days}天 ${hours % 24}小时`;
            if (hours > 0) return `${hours}小时 ${minutes % 60}分`;
            if (minutes > 0) return `${minutes}分 ${seconds % 60}秒`;
            return `${seconds}秒`;
        }

        // 从本地API获取数据
        async function fetchData() {
            try {
                const response = await fetch(`${API_BASE}/data/latest`);
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('获取数据失败:', error);
            }
        }

        // 从设备获取数据
        async function fetchDeviceData() {
            try {
                const response = await fetch('http://192.168.1.100/api/data');
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('获取设备数据失败:', error);
            }
        }

        // 更新UI
        function updateUI(data) {
            // 更新传感器数值
            document.getElementById('coValue').textContent = data.co.toFixed(1);
            document.getElementById('h2sValue').textContent = data.h2s.toFixed(1);
            document.getElementById('pm25Value').textContent = data.pm25.toFixed(0);
            document.getElementById('tempValue').textContent = data.temperature.toFixed(1) + '°C';
            document.getElementById('humValue').textContent = '湿度: ' + data.humidity.toFixed(0) + '%';

            // 更新状态
            const coAlert = getAlertLevel(data.co, THRESHOLDS.co);
            const h2sAlert = getAlertLevel(data.h2s, THRESHOLDS.h2s);
            const pm25Alert = getAlertLevel(data.pm25, THRESHOLDS.pm25);

            document.getElementById('coStatus').textContent = coAlert.text;
            document.getElementById('coStatus').className = 'card-status ' + coAlert.class;

            document.getElementById('h2sStatus').textContent = h2sAlert.text;
            document.getElementById('h2sStatus').className = 'card-status ' + h2sAlert.class;

            document.getElementById('pm25Status').textContent = pm25Alert.text;
            document.getElementById('pm25Status').className = 'card-status ' + pm25Alert.class;

            // 更新主状态
            const mainLevel = Math.max(coAlert.level, h2sAlert.level, pm25Alert.level);
            const mainStatus = document.getElementById('mainStatus');
            const statusMap = [
                { text: '正常', class: 'status-safe' },
                { text: '注意', class: 'status-warning' },
                { text: '警告', class: 'status-danger' },
                { text: '危险', class: 'status-critical' }
            ];
            mainStatus.textContent = statusMap[mainLevel].text;
            mainStatus.className = 'status-badge ' + statusMap[mainLevel].class;

            // 更新设备信息
            document.getElementById('wifiRssi').textContent = data.wifi_rssi + ' dBm';
            document.getElementById('uptime').textContent = formatUptime(data.uptime);
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

            // 更新图表
            updateChart(data);
        }

        // 初始化图表
        function initChart() {
            const ctx = document.getElementById('dataChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'CO (ppm)',
                            data: [],
                            borderColor: '#F44336',
                            backgroundColor: 'rgba(244, 67, 54, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'H2S (ppm)',
                            data: [],
                            borderColor: '#9C27B0',
                            backgroundColor: 'rgba(156, 39, 176, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'PM2.5 (μg/m³)',
                            data: [],
                            borderColor: '#FF9800',
                            backgroundColor: 'rgba(255, 152, 0, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // 更新图表
        function updateChart(data) {
            const now = new Date().toLocaleTimeString();

            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(data.co);
            chart.data.datasets[1].data.push(data.h2s);
            chart.data.datasets[2].data.push(data.pm25);

            // 限制数据点数量
            if (chart.data.labels.length > 60) {
                chart.data.labels.shift();
                chart.data.datasets.forEach(ds => ds.data.shift());
            }

            chart.update();
        }

        // 设置时间范围
        function setTimeRange(hours) {
            timeRange = hours;
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // 刷新数据
        async function refreshData() {
            await fetchData();
        }

        // 静音控制
        async function toggleMute() {
            try {
                await fetch('http://192.168.1.100/api/control?action=mute');
                alert('静音切换成功');
            } catch (error) {
                console.error('静音控制失败:', error);
            }
        }

        // 清除报警
        async function resolveAlerts() {
            try {
                await fetch(`${API_BASE}/alerts/resolve_all`, { method: 'POST' });
                alert('报警已清除');
            } catch (error) {
                console.error('清除报警失败:', error);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            fetchData();
            setInterval(fetchData, 5000);
        });
    </script>
</body>
</html>
