    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - home

  # ── 家庭证件档案 后端 API ───────────────────────────────
  certs-api:
    build: ./apps/certs/server
    container_name: myhome-certs-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/certs
    expose:
      - "5000"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - home

  portal:
    image: nginx:alpine
    container_name: myhome-portal
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - music-api
      - wiki-api
      - album-api
      - calendar-api
      - carlog-api
      - pantry-api
      - board-api
      - docs-api
      - subs-api
      - tasks-api
      - health-api
      - recipes-api
      - menu-api
      - ledger-api
      - assets-api
      - medkit-api
      - films-api
      - travel-api
      - plants-api
      - books-api
      - pets-api
      - vault-api
      - homeenv-api
      - repair-api
      - growth-api
      - energy-api
      - insurance-api
      - certs-api
      - portal-api
    networks:
      - home

  portal-api:/n    build: ./portal-api
    container_name: myhome-portal-api
    environment:/n      APP_JSON: /data/apps.json
    volumes:/n      - ./apps.json:/data/apps.json:rw
    expose:/n      - "5000"
    restart: unless-stopped
    networks:/n      - home

  # ── 音乐播放器后端 API ───────────────────────────────────────
  music-api:
    build: ./apps/music/server
    container_name: myhome-music-api
    environment:
      # 连【共享】PostgreSQL 实例，使用专属 database: music
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/music
      # 音乐库：key:标签:容器内路径（多个用逗号分隔）。
      # 本地目录默认映射到 ./data/music（把歌曲放这里即可）。
      # NAS 音乐源在 Web 页面「管理 NAS」里动态挂载，无需在此配置。
      MUSIC_LIBRARIES: local:本地音乐:/music/local
    expose:
      - "5000"
    volumes:
      # 本地音乐：映射到 ./data/music（把歌曲放这里即可）
      - ./data/music:/music/local
    # NAS 在容器内运行时挂载，需要 SYS_ADMIN 能力 + 关闭 apparmor 限制（仅本机家庭服务器，可接受）
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    # 服务器端出声：把宿主声卡透传进容器（服务器需接功放/音箱）。
    # ⚠️ 若宿主机【没有】音频设备（如纯开发机），请删除下面这两行，否则容器无法启动；
    #    删除后仅「服务器音箱」播放不可用，其余功能（电台/音乐库浏览/收藏）不受影响。
    devices:
      - "/dev/snd"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - home

  # ── 家用手册 Wiki 后端 API ───────────────────────────────
  wiki-api:
    build: ./apps/wiki/server
    container_name: myhome-wiki-api
    environment:
      # 连【共享】PostgreSQL 实例，使用专属 database: wiki
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/wiki
    expose:
      - "5000"
    volumes:
      - ./data/wiki:/data/wiki
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - home

  # ── 家庭相册后端 API ───────────────────────────────────────
  album-api:
