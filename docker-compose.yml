  # ── 孩子成长日志后端 API ───────────────────────────────
  # ── 孩子成长日志 后端 API ───────────────────────────────
  growth-api:
    build: ./apps/growth/server
    container_name: myhome-growth-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/growth
