  # ── 家庭能耗记录 后端 API ───────────────────────────────
  energy-api:
    build: ./apps/energy/server
    container_name: myhome-energy-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/energy
