services:
  # ── 门户 + 反向代理（统一入口） ───────────────────────────────
  # ── 家庭环境记录 后端 API ───────────────────────────────
  homeenv-api:
    build: ./apps/homeenv/server
    container_name: myhome-homeenv-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/homeenv
    expose:
      - "5000"
    restart: unless-stopped
    depends_on:
