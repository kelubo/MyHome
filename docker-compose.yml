    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - home

  # ── 家庭保险保单 后端 API ───────────────────────────────
  insurance-api:
    build: ./apps/insurance/server
    container_name: myhome-insurance-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/insurance
