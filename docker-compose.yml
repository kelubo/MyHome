  pets-api:
    build: ./apps/pets/server
    container_name: myhome-pets-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/pets
    expose:
      - "5000"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - home

  # ── 家庭密码箱后端 API ─────────────────────────────
  vault-api:
    build: ./apps/vault/server
    container_name: myhome-vault-api
    environment:
      # 敏感字段以 Fernet 加密存储；密钥取自 VAULT_KEY 或落盘 ./data/vault/vault.key
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/vault
      VAULT_DIR: /data/vault
    expose:
      - "5000"
    volumes:
      - ./data/vault:/data/vault
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - home

  # ── 共享数据库：所有需要持久化的应用都连这一个 PostgreSQL 实例 ──
  # 每个应用使用独立的 database（见 postgres-init/01-create-dbs.sql）。
  # 数据统一落在宿主机 ./data/postgres（bind 挂载），便于整体备份。
  medkit-api:
    build: ./apps/medkit/server
    container_name: myhome-medkit-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/medkit
    expose:
      - "5000"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - home


  films-api:
    build: ./apps/films/server
    container_name: myhome-films-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/films
    expose:
      - "5000"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - home


  travel-api:
    build: ./apps/travel/server
    container_name: myhome-travel-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/travel
      GEO_DIR: /data/geo
    expose:
      - "5000"
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:/n      - ./data/travel-geo:/data/geo
    networks:
      - home


  plants-api:
    build: ./apps/plants/server
    container_name: myhome-plants-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/plants
    expose:
      - "5000"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - home


  postgres:
    image: postgres:16-alpine
    container_name: myhome-postgres
    environment:
      POSTGRES_USER: myhome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # ⚠️ 请务必改成你自己的强密码
      # 首次初始化（./data/postgres 为空时）会自动执行 postgres-init/*.sql 建库
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # 如需在本机用 psql / pgAdmin 直连，取消下面注释（默认关闭以避免 5432 端口冲突）
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    networks:
      - home

networks:
  home:
    driver: bridge
