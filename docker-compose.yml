  # ── 家电 / 资产管理后端 API ────────────────────────
  assets-api:
    build: ./apps/assets/server
    container_name: myhome-assets-api
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/assets
