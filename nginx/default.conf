server {
    listen 80;
    server_name _;

    # 上传大文件（照片/附件）需要放宽；默认 1m 会截断上传
    client_max_body_size 200m;

    # 仓库根目录作为静态内容根：/ -> 门户，/apps/* -> 各应用，其余按文件/目录提供
    root /usr/share/nginx/html;
    autoindex on;

    # 首页即门户仪表盘
    location = / {
        try_files /portal/index.html =404;
    }

    # 应用开关全局后端（反代到 portal-api 服务；读写 apps.json 的 enabled 开关）
    location /portal-api/ {
        proxy_pass http://portal-api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 音乐播放器后端 API（反代到 music-api 服务）
    location /apps/music/api/ {
        proxy_pass http://music-api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 家用手册 Wiki 后端 API（反代到 wiki-api 服务）
    location /apps/wiki/api/ {
        proxy_pass http://wiki-api:5000/;
